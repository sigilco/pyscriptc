# Toolchain for pyscriptc dev + docs site. `mise install` once, then:
#   mise run setup     first-time: uv sync + pnpm install (docs/.docmd)
# clang and a C toolchain are also required at compile/run time but are
# system packages, not mise tools (apt install clang).
#
# Tasks (mise run <name>):
#   docs:dev        public docs dev server (docs/, docs/.docmd/docmd.config.js)
#   docs:build      build the public docs site to dist/docs
#   docs:validate   check every internal link in docs/
#   docs:internal   dev server for the internal notes (.agents/docs), dev-only
#   compat:build    build the compat page to dist/compat
#   site:build      build the three site parts and assemble deploy/
#   site:check      link check over deploy/
#   site:dev        run one part dev server (landing, docs or compat)
#   test            python test suite (no linux_container)
#   lint            ruff check
#   format-check    ruff format --check
#   check           lint + format-check + the unit (compat2) test selection
#   bench:baseline  perf regression gate against benchmarks/baseline/reference*.json
#   compat:json     rebuild compat/data/compat.json (add --check to compare)
#   compat:ladder   rebuild compat/data/ladder.json
#   compat:census   compat2 census over the visible corpus (--top N)
#   support:table   regenerate the supported-API tables under .agents/docs/support
#   boxed:cost      boxed ledger window (add --reach/--probe-times when you have them)
#   ir:hashes       canonical IR hash compare against the committed baseline (linux only, see below)
#   compile         pyscriptc compile, args pass through (mise run compile FILE --emit bin)
#   run             pyscriptc run, args pass through (mise run run FILE -- args)
#   wheel:smoke     build the wheel, install it in a fresh venv, compile+run hello
#   release:rehearse  dispatch release.yml on the master tip (the rehearsal run)
#
# CI does not run through mise: the workflows pin uv (the emSign CA incident
# floor, >= 0.13.4) and node/pnpm independently, and switching would re-resolve
# tool versions on every run for no gain. mise is the local entrypoint only.

[tools]
python = "3.14"
uv = "latest"
node = "22"
pnpm = "12"

[tasks.setup]
description = "First-time install of the python and node toolchains"
run = ["uv sync", "pnpm --dir docs/.docmd install"]

[tasks."docs:dev"]
description = "Public docs dev server (docs/)"
run = "pnpm --dir docs/.docmd exec docmd dev --config docmd.config.js"

[tasks."docs:build"]
description = "Build the public docs site to dist/docs"
run = "pnpm --dir docs/.docmd exec docmd build --config docmd.config.js"

[tasks."docs:validate"]
description = "Validate docs/ pages and internal links"
run = "uv run python scripts/check_doc_links.py"

[tasks."docs:internal"]
description = "Dev server for .agents/docs internal notes (no build step)"
run = "pnpm --dir docs/.docmd exec docmd dev --config docmd.internal.config.js"

[tasks."compat:build"]
description = "Build the compat page to dist/compat"
run = "uv run python compat/build.py"

[tasks."site:build"]
description = "Build landing, docs and compat, assemble deploy/"
run = "uv run python scripts/build_site.py"

[tasks."site:check"]
description = "Link check over the assembled deploy/ tree"
run = "uv run python scripts/check_site_links.py --external"

[tasks."site:dev"]
description = "Dev server for one site part: mise run site:dev landing|docs|compat"
run = "uv run python scripts/site_dev.py"

[tasks.test]
description = "Python test suite, linux_container excluded"
run = "uv run pytest -n auto -m 'not linux_container'"

[tasks.lint]
description = "ruff check"
run = "uv run ruff check"

[tasks.format-check]
description = "ruff format --check (same excludes as CI)"
run = """
uv run ruff format --check \
  --exclude src/pyscriptc \
  --exclude benchmarks/compat/score.py \
  --exclude .agents/docs/loop.md \
  --exclude benchmarks/runtime/workloads/pow_loop.py \
  --exclude benchmarks/runtime/workloads/tuple_membership.py \
  --exclude benchmarks/compat2/bundle.py \
  --exclude benchmarks/compat2/cache.py \
  --exclude benchmarks/compat2/corpus/spec.py \
  --exclude benchmarks/compat2/coverage_map.py \
  --exclude benchmarks/compat2/score.py
"""

[tasks.check]
description = "lint + format-check + tests/compat2 (the CI unit job)"
depends = ["lint", "format-check"]
run = "uv run pytest -q tests/compat2 -m 'not linux_container'"

# The rest of the checks, one command each. CI runs the raw commands in the
# workflows, not through mise (see the header comment).

[tasks."bench:baseline"]
description = "Perf regression gate against benchmarks/baseline/reference*.json"
run = "uv run python -m benchmarks.baseline.run --check"

[tasks."compat:json"]
description = "Rebuild compat/data/compat.json (append --check to compare against the committed file)"
run = "uv run python scripts/build_compat_json.py"

[tasks."compat:ladder"]
description = "Rebuild compat/data/ladder.json"
run = "uv run python -m benchmarks.scripts_corpus.ladder --json compat/data/ladder.json"

[tasks."support:table"]
description = "Regenerate compat/data/support.json from compiler and probe data (add --check to compare)"
run = "uv run python scripts/gen_support_table.py"

[tasks."docs:what-will-fail"]
description = "Regenerate compat/data/what_will_fail.json from the R0 corpus (add --check to compare)"
run = "uv run python scripts/gen_what_will_fail.py"

[tasks."compat:census"]
description = "Compat2 census over the visible corpus (append --top N to limit)"
run = "uv run python -m benchmarks.compat2.census --top 10"

[tasks."boxed:cost"]
description = "Boxed ledger window, per AGENTS.md (append --reach/--probe-times when you have them)"
run = "uv run python benchmarks/compat2/boxed_cost.py --window-commits 10"

# Linux only, like the ir-hashes workflow: the canonical IR folds host
# constants (socket, errno, os, ssl, time, ctypes, pathlib), so a macOS run
# diffs against the committed linux baseline as noise, not a regression.
# The baseline header carries the oracle stamp (cpython-3.14.9 today), so a
# newer interpreter micro reports exit 2 (stale header): that is the regen
# signal, not a hash mismatch. Regenerate with .github/workflows/ir-hashes.yml
# (generate mode), then copy the artifact over the baseline.
[tasks."ir:hashes"]
description = "Canonical IR hash compare against the committed baseline (linux oracle)"
run = "uv run python -m benchmarks.compat2.irscore benchmarks/compat2/probes --baseline benchmarks/compat2/probes/IR_HASHES.json"

[tasks.compile]
description = "pyscriptc compile, extra args pass through (mise run compile examples/hello.py --emit bin)"
run = "uv run pyscriptc compile"

[tasks.run]
description = "pyscriptc run (content-cached compile + execute), args pass through"
run = "uv run pyscriptc run"

# Same shape as the wheel-smoke job in ci.yml and the verify job in release.yml.
[tasks."wheel:smoke"]
description = "Build the wheel, install it in a fresh venv, compile and run hello"
run = "bash scripts/wheel_smoke.sh"

# The rehearsal is a workflow_dispatch of release.yml on the full SHA. Only a
# run titled "rehearsal <full SHA>" counts for the cut-release and publish gates.
[tasks."release:rehearse"]
description = "Dispatch release.yml on the master tip (rehearsal; takes about 20 minutes)"
run = "gh workflow run release.yml --ref master -f ref=\"$(git rev-parse origin/master)\""
