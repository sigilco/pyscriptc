[project]
name = "pyscriptc"
version = "0.1.0"
description = "Lower a typed subset of Python to LLVM, with CPython as the island."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Joaquin Terrasa" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "mypy>=2.4",
    "pyrefly>=1.4.0,<1.5",
]

[project.urls]
Homepage = "https://github.com/sigilco/pyscriptc"
Repository = "https://github.com/sigilco/pyscriptc"
Issues = "https://github.com/sigilco/pyscriptc/issues"
Reference = "https://github.com/vercel-labs/scriptc"

[project.scripts]
pyscriptc = "pyscriptc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]
# Release binary build only (packaging/). Not installed by a plain `uv sync`.
packaging = ["nuitka>=4.0", "zstandard>=0.23", "ordered-set>=4.1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyscriptc = ["runtime/*.c", "runtime/*.h", "_pyright_stubs/*/__init__.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "linux_container: Linux dev container suite (HEAVY=1 .agents/docker/run.sh). Shells out to clang or only passes on Linux. CI does not run these.",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests", "benchmarks"]
extend-exclude = [
    "benchmarks/compat/top100",
    "benchmarks/compat/pyjwt/src/jwt",
    "benchmarks/compat2/corpus/src",
    "benchmarks/compat2/corpus/tests",
    "benchmarks/compat2/corpus/holdout/src",
    "benchmarks/compat2/corpus/holdout/tests",
    "benchmarks/compat2/corpus/scripts",
    "benchmarks/compat2/corpus/holdout/scripts",
    "src/pyscriptc/_pyright_stubs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pyscriptc"]

[tool.ruff.format]
quote-style = "double"
