# Third-party components compiled into the bundled CPython runtime.

# Inventory of the python-build-standalone `full` archive the runtime pack is
# cut from (docs/reference/runtime-pack.md). One entry per third-party
# component that ships compiled into libpython, so the notice rollup in NOTICE
# and the `licenses/` directory of the pack describe the same set.
#
# Update this file together with packaging/runtime.lock.toml when the pack
# moves; the full license texts come from the `licenses/` directory of the
# matching `full` archive, this file only records what is there. The
# inventory is confirmed with the owner before the first public release that
# ships a pack (issue #663).
#
# schema = 1
# [[components]]
# name = "expat"            # component name as the PBS inventory lists it
# version = "2.7.3"         # version compiled into the pinned libpython
# license = "MIT"           # SPDX expression or short license name
# homepage = "..."          # optional upstream home
# note = "..."              # optional clarifier, quoted in NOTICE

schema = 1

[[components]]
name = "expat"
version = "2.7.3"
license = "MIT"
homepage = "https://libexpat.github.io/"

[[components]]
name = "libffi"
version = "3.5.2"
license = "MIT"
homepage = "https://sourceware.org/libffi/"

[[components]]
name = "mpdecimal"
version = "2.5.1"
license = "BSD-2-Clause"
homepage = "https://www.bytereef.org/mpdecimal/"

[[components]]
name = "OpenSSL"
version = "3.5.4"
license = "Apache-2.0"
homepage = "https://www.openssl.org/"

[[components]]
name = "SQLite"
version = "3.51.0"
license = "blessing"
homepage = "https://www.sqlite.org/"

[[components]]
name = "zlib"
version = "1.3.1"
license = "Zlib"
homepage = "https://zlib.net/"

[[components]]
name = "zstd"
version = "1.5.7"
license = "BSD-3-Clause"
homepage = "https://github.com/facebook/zstd"

[[components]]
name = "ncurses"
version = "6.5"
license = "MIT"
homepage = "https://invisible-island.net/ncurses/"
