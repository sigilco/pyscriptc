# pyscriptc-http: the TLS transport for the native HTTP client (issue #235).
#
# The manifest declares the link inputs of the adapter. The https half of
# `urllib.request` is reached through the runtime's transport seam
# (`src/pyscriptc/runtime/ps_http_tls.h`), so the script's own surface does
# not change: the adapter's module claim (`pyscriptc_http`) exists so the
# manifest binds one seam, and nothing from it is imported by a script.
# The vendored mbedTLS is fetched by `fetch_vendor.py`; only the pin is
# committed (vendor/VENDOR.toml, the sqlite adapter's pattern).

[manifest]
module = "pyscriptc_http"
ps_abi = 1
format = 1

# The adapter thunk: the transport seam (connect, verified handshake,
# write, read, close) the runtime's ps_http.c calls for an https:// URL.
[[source]]
path = "ps_ffi_http_tls.c"

