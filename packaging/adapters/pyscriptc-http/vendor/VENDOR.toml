# Pinned mbedTLS release for the pyscriptc-http TLS transport (issue #235).
#
# The tarball is not committed: fetch_vendor.py downloads it, checks the
# sha256, unpacks it, applies the config trim (the four DTLS and server-side
# options the client transport never reaches) and then checks the sha256 of
# five files against the values below, so the fetched tree is byte-identical
# on every host.
