# pyscriptc-arrow: the Arrow C Data / C Stream data-plane manifest (#1209).
#
# The first data-plane adapter after the sqlite (#66) and zlib (#240) pilots:
# it binds the vendor-neutral Arrow C Data Interface and C Stream handshake
# (nanoarrow, two vendored files under vendor/) so a compiled program can
# exchange columnar data with any Arrow implementation (PyArrow, Polars,
# nanoarrow under CPython) with no interpreter on the far side.
#
# The vendored nanoarrow is the bundled distribution generated by
# ci/scripts/bundle.py from the pinned release tarball (see
# vendor/VENDOR.toml); only the pin and the license travel in git, the
# bundle is fetched by fetch_vendor.py like the sqlite amalgamation. The
# bundle carries the IPC half (the Arrow C Stream wire form) and the
# flatcc runtime it is built on, so three C units go on the link line.

[manifest]
module = "pyscriptc_arrow"
ps_abi = 1
format = 1
# The vendored bundle's header tree lives under vendor/, and the flatcc
# headers the IPC unit includes sit under vendor/flatcc/. The manifest's
# own directory is always on the include path, so the two entries below
# are the extra roots the bundle needs.
include_dirs = ["vendor"]

[[source]]
path = "vendor/flatcc.c"

[[source]]
path = "vendor/nanoarrow_ipc.c"

[[source]]
path = "vendor/nanoarrow.c"

[[source]]
path = "ps_ffi_arrow.c"

# The pointer behind a handle is a thunk-owned wrapper around the Arrow C
# Data struct pair, so a released handle is detectable and raises instead of
# touching freed memory (the sqlite pilot's wrapper discipline).
[[handle]]
name = "Array"
c_type = "ps_arrow_array *"
frees = "ps_ffi_arrow_array_release"

[[handle]]
name = "Stream"
c_type = "ps_arrow_stream *"
frees = "ps_ffi_arrow_stream_release"

[[const]]
name = "INT32"
type = "int"
value = 1

[[const]]
name = "INT64"
type = "int"
value = 2

[[const]]
name = "FLOAT32"
type = "int"
value = 3

[[const]]
name = "FLOAT64"
type = "int"
value = 4

[[const]]
name = "BOOL"
type = "int"
value = 5

[[const]]
name = "UTF8"
type = "int"
value = 6

# --- import: an Arrow C Data struct pair produced elsewhere ---------------
#
# The C Data Interface structs are plain C memory, so the exchange with a
# live producer (PyArrow, Polars, nanoarrow) happens through the adapter's
# host shim: the producer exports into a struct the shim hands to
# import_array, and the compiled program reads the column. Nothing here
# inspects a value at runtime: the dtype word fixes the element type at
# lower time, exactly like the sqlite manifest's `py` strings.

# import_array(dtype, values) -> Array: build an Arrow array of `dtype`
# from the subset list `values` and hand back an owned handle. The thunk
# appends through nanoarrow, so the result is a real Arrow C Data struct
# pair any consumer can import.
[[fn]]
name = "import_array"
py = "(dtype: int, values: list[int]) -> Array"
c_symbol = "ArrowArrayInitFromType + ArrowArrayAppendInt/Double"
abi = "ps_ffi_arrow_import_array"

# array_length(array) -> int: the row count, the C Data `length` field.
[[fn]]
name = "array_length"
py = "(array: Array) -> int"
c_symbol = "ArrowArray.length"
abi = "ps_ffi_arrow_array_length"
borrows = ["array"]

# array_sum(array) -> float: the column total. The float return keeps one
# signature for every numeric dtype (int32/int64/float32/float64); the
# thunk widens each element to double, so an int64 column above 2**53
# loses integer precision here, which the divergence ledger records.
[[fn]]
name = "array_sum"
py = "(array: Array) -> float"
c_symbol = "ArrowArrayViewGetIntUnsafe/GetDoubleUnsafe"
abi = "ps_ffi_arrow_array_sum"
borrows = ["array"]

# array_get(array, index) -> float: one element widened to double, the same
# precision caveat as array_sum.
[[fn]]
name = "array_get"
py = "(array: Array, index: int) -> float"
c_symbol = "ArrowArrayViewGetIntUnsafe/GetDoubleUnsafe"
abi = "ps_ffi_arrow_array_get"
borrows = ["array"]

# array_is_null(array, index) -> bool: the C Data validity bitmap read.
[[fn]]
name = "array_is_null"
py = "(array: Array, index: int) -> bool"
c_symbol = "ArrowArrayViewIsNull"
abi = "ps_ffi_arrow_array_is_null"
borrows = ["array"]

# --- exchange: the C Data struct pair -------------------------------------

# export_array(array, out_array_ptr, out_schema_ptr) is not a manifest row:
# the C Data structs are plain memory, so the producer and the consumer
# exchange them directly through the adapter's host shim (the acceptance
# test does this through ctypes; see tests/host_main.c). What the manifest
# carries is the value exchange over the subset list, the accessors and
# the wire form below.

# --- the wire form: the Arrow IPC stream -----------------------------------

# export_array(array) -> bytes: the handle's column as one IPC stream
# record batch, the bytes a consumer under CPython reads with
# `pyarrow.ipc.open_stream`. The batch carries one column named `v`; the
# handle is read, not consumed, so exporting twice is legal.
[[fn]]
name = "export_array"
py = "(array: Array) -> bytes"
c_symbol = "ArrowIpcWriterWriteArrayStream"
abi = "ps_ffi_arrow_export_array"
borrows = ["array"]

# import_stream(data) -> Stream: decode the bytes of an Arrow IPC stream.
# A producer under CPython hands over the bytes of its own
# `__arrow_c_stream__`; the stream must carry exactly one column.
[[fn]]
name = "import_stream"
py = "(data: bytes) -> Stream"
c_symbol = "ArrowIpcArrayStreamReaderInit"
abi = "ps_ffi_arrow_import_stream"

# stream_read(stream) -> list[dict[str, str]]: the next batch of the
# stream as records, one row per element, the column under the fixed name
# `v`. The end of the stream is an empty list.
[[fn]]
name = "stream_read"
py = "(stream: Stream) -> list[dict[str, str]]"
c_symbol = "ArrowArrayStreamGetNext"
abi = "ps_ffi_arrow_stream_read"
borrows = ["stream"]

# stream_release(stream) -> None: drop the decoded stream. The compiler's
# ownership rule (issue #224) makes this the only consuming call.
[[fn]]
name = "stream_release"
py = "(stream: Stream) -> None"
c_symbol = "ArrowArrayStreamRelease"
abi = "ps_ffi_arrow_stream_release"
consumes = ["stream"]

# release(array) -> None: drop the handle's C Data struct pair. The
# compiler's ownership rule (issue #224) makes this the only consuming call;
# a handle that leaves scope is released by the same symbol.
[[fn]]
name = "release"
py = "(array: Array) -> None"
c_symbol = "ArrowArrayRelease + ArrowSchemaRelease"
abi = "ps_ffi_arrow_array_release"
consumes = ["array"]
