# Pinned nanoarrow bundle (issue #1209). The vendored files are generated
# from this release tarball by nanoarrow's own `ci/scripts/bundle.py` with
# `--symbol-namespace=PsArrow`; the command is in fetch_vendor.py. The
# bundle is not committed: fetch_vendor.py regenerates it, checks every
# hash below and writes vendor/nanoarrow.c, vendor/nanoarrow_ipc.c,
# vendor/flatcc.c and the two header trees (all gitignored).
#
# The IPC half (nanoarrow_ipc) is what carries the Arrow C Stream wire
# form; it needs flatcc (the FlatBuffers runtime nanoarrow's IPC encoder
# and decoder are built on), so the bundle is generated with `--with-ipc
# --with-flatcc`. The `--with-ipc` bundle alone does not compile: the
# generated IPC unit includes the flatcc headers, so the two flags go
# together.
name = "nanoarrow"
version = "0.9.0"
license = "Apache-2.0"
url = "https://github.com/apache/arrow-nanoarrow/releases/download/apache-arrow-nanoarrow-0.9.0/apache-arrow-nanoarrow-0.9.0.tar.gz"
tar_sha256 = "801200a0e95e869d5c4bdeb5b535dba58551482bb782b7dc8bd599c8b6e8cacf"
bundle_namespace = "PsArrow"
bundle_flags = "--with-ipc --with-flatcc"
# Generated (bundle.py is deterministic: two runs are byte-identical).
"nanoarrow.c_sha256" = "71df0f041932023f666fceae9a9e087bc26263b1058e69be5dd7ca656e08f04a"
"nanoarrow_ipc.c_sha256" = "288cfac16799ab0600435b8492b861de403603fe93d4508dd049f05222a882a7"
