# pyscriptc-sqlite: the F3 pilot manifest (.agents/docs/ffi/ffi-manifest.md section 5).
# The vendored SQLite amalgamation is fetched at build time into vendor/
# (see vendor/VENDOR.toml); only the pin is committed.
#
# The v2 surface (issue #1343) adds parameter binding and typed rows on top
# of the v1 pilot's five functions. The v1 names keep their shape; the new
# names carry the second spelling so a v1 program compiles unchanged:
#
#   execute(db, sql)          v1: run the statement, return SQLite's OK
#   execute2(db, sql, params) v2: run the statement with `?` bindings
#   query(db, sql)            v1: the rows as dict[str, str]
#   query2(db, sql, params)   v2: the rows as dict[str, object]

[manifest]
module = "pyscriptc_sqlite"
ps_abi = 1
format = 1

[[source]]
path = "vendor/sqlite3.c"

[[source]]
path = "ps_ffi_sqlite.c"

# The pointer behind a handle is a thunk-owned wrapper around sqlite3 *, so a
# closed handle is detectable and raises instead of touching freed memory.
[[handle]]
name = "Connection"
c_type = "ps_sqlite_conn *"
frees = "sqlite3_close_v2"

[[const]]
name = "OK"
type = "int"
value = 0

[[const]]
name = "ROW"
type = "int"
value = 100

[[const]]
name = "DONE"
type = "int"
value = 101

[[fn]]
name = "connect"
py = "(path: str) -> Connection"
c_symbol = "sqlite3_open_v2"
abi = "ps_ffi_sqlite_connect"

[[fn]]
name = "execute"
py = "(db: Connection, sql: str) -> int"
c_symbol = "sqlite3_exec"
abi = "ps_ffi_sqlite_execute"
borrows = ["db"]

[[fn]]
name = "query"
py = "(db: Connection, sql: str) -> list[dict[str, str]]"
c_symbol = "sqlite3_prepare_v2 + sqlite3_step + sqlite3_finalize"
abi = "ps_ffi_sqlite_query"
borrows = ["db"]

[[fn]]
name = "commit"
py = "(db: Connection) -> int"
c_symbol = "sqlite3_exec COMMIT"
abi = "ps_ffi_sqlite_commit"
borrows = ["db"]

[[fn]]
name = "close"
py = "(db: Connection) -> None"
c_symbol = "sqlite3_close_v2"
abi = "ps_ffi_sqlite_close"
consumes = ["db"]

# The v2 surface (issue #1343).

[[fn]]
name = "connect2"
py = "(path: str, timeout: float) -> Connection"
c_symbol = "sqlite3_open_v2 + sqlite3_busy_timeout"
abi = "ps_ffi_sqlite_connect2"

[[fn]]
name = "execute2"
py = "(db: Connection, sql: str, params: list[object]) -> int"
c_symbol = "sqlite3_prepare_v2 + sqlite3_bind_* + sqlite3_step"
abi = "ps_ffi_sqlite_execute2"
borrows = ["db"]

[[fn]]
name = "executemany"
py = "(db: Connection, sql: str, rows: list[list[object]]) -> int"
c_symbol = "sqlite3_prepare_v2 + sqlite3_bind_* + sqlite3_step"
abi = "ps_ffi_sqlite_executemany"
borrows = ["db"]

[[fn]]
name = "query2"
py = "(db: Connection, sql: str, params: list[object]) -> list[dict[str, object]]"
c_symbol = "sqlite3_prepare_v2 + sqlite3_bind_* + sqlite3_step"
abi = "ps_ffi_sqlite_query2"
borrows = ["db"]

[[fn]]
name = "lastrowid"
py = "(db: Connection) -> int"
c_symbol = "sqlite3_last_insert_rowid"
abi = "ps_ffi_sqlite_lastrowid"
borrows = ["db"]
