# Pinned CPython source build for the static single-binary island (#672).
#
# The static island interpreter is built from the CPython *source* tarball,
# not from a prebuilt archive: the python-build-standalone `pgo+lto-full`
# archives ship an `libpython3.14.a` that is LLVM bitcode (producer LLVM
# 23.1.3), which Apple ld (LLVM 21) rejects ("Unknown attribute kind (105)")
# and zig 0.16 rejects ("unknown cpu architecture: 0"). A source build gives
# a plain object archive that every linker we use can consume.
#
# `sha256` is the hash of the upstream tarball; `scripts/build_static_cpython.py`
# verifies it before unpacking and refuses a mismatch. `version` is the CPython
# micro and must track `packaging/runtime.lock.toml` (the shared-bundle pack):
# the island runtime (`ps_island.c`) compiles against one Python.h, so a
# static build of a different micro is a different ABI.
#
# `setup_local` is the curated builtin module list copied to Modules/Setup.local
# of the source tree. It is what turns the extensions (math, _datetime, ...)
# into builtins instead of shared objects under lib-dynload.
#
# `configure_args` is the pinned flag set. `--disable-shared` is what makes a
# single-file binary possible; `--enable-optimizations` turns on PGO (the
# profile task runs during `make`), worth about 10 percent on the embedding
# plan's benchmark.
schema = 1
version = "3.14.9"

[source]
url = "https://www.python.org/ftp/python/3.14.9/Python-3.14.9.tar.xz"
sha256 = "e02d9ac21cebda6e46435369744a92c65cc7cd8669697694122cf97ffacd1e53"
filename = "Python-3.14.9.tar.xz"

[build]
setup_local = "packaging/Setup.local"
prefix = "python3.14-static"
configure_args = [
  "--disable-shared",
  "--enable-optimizations",
  "--without-ensurepip",
  "--without-doc-strings",
  "--disable-test-modules",
  "--with-pydebug=no",
]

# The measured cost of the build, per platform. `build_minutes` is the
# wall-clock of a cold `configure + make -j + make install` on a 4-core
# runner (the GitHub-hosted standard runner); `download_mb` is the tarball
# size. These numbers are the CI budget argument for issue #672: see
# `.agents/docs/release/static-cpython.md` for the measurement and the
# decision to keep the build off the required CI path.
[cost]
build_minutes = 12
download_mb = 24
