# Pinned CPython runtime packs for `--embed-python=bundle` (Refs #657).
#
# A pack is produced by the release workflow job `runtime-pack` from the
# python-build-standalone (PBS) assets pinned here: the `install_only_stripped`
# archive carries libpython, the headers and the stdlib; the CPython license
# file is taken from the same archive's `lib/python3.X.Y/LICENSE.txt`. PBS 3.14
# macOS archives ship no third-party `licenses/` directory (the plan's claim
# that the `full` archive does applies to Linux); the producer copies such a
# directory when the archive has one.
#
# `sha256` is the hash of the downloaded PBS asset, verified before use by
# `scripts/build_runtime_pack.py` and by `pyscriptc embed fetch`. Bump a
# release by re-running the producer and pasting the new hashes; a CPython
# security micro is a pack change and nothing else (3.14 stable ABI).
#
# `pyscriptc embed fetch` resolves a pack by host platform and micro from this
# table. The `PYSC_RUNTIME_DIR` environment variable points at an already
# unpacked pack directory for offline and air-gapped machines.
schema = 1
release = "20261021"
cpython = "3.14.9"

[runtime."3.14.9".macos-arm64]
pbs_asset = "cpython-3.14.9+20261021-aarch64-apple-darwin-install_only_stripped.tar.gz"
sha256 = "9f8c3480b8f0db553c270db548e8a21ae8e39df412e5661d66e8050c5c6ed2a8"

[runtime."3.14.9".linux-x86_64]
pbs_asset = "cpython-3.14.9+20261021-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
sha256 = "561e91c1cadf30e84aec94d1917384ae3267e5f3e6e135e51fd1578bb19f4064"
