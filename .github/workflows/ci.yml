name: ci

on:
  push:
  pull_request:

# `linux_container` is the Linux dev container suite:
# HEAVY=1 docker/run.sh
# Those tests shell out to clang or only pass on Linux. The shard jobs do
# not run that marker; the TSan job does, because the thread sanitizer is
# clang-only and needs its own process (it cannot share one with ASan).
# The workflow still does not run the heavy container, the full compiler
# suite, or probe calibration.
#
# ruff format skips src/pyscriptc, the frozen v1 scorer, loop.md, and two
# workload files. Those still fail format under ruff 0.17; reformatting them
# is not part of this workflow.
# Linux (unit): ruff plus compat2 under tests/compat2.
# macOS (macos-safe): the rest of the test tree on macos-14, excluding
# compat2 and any test marked linux_container.

jobs:
  secrets:
    name: betterleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install betterleaks 1.9.0
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/Betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz -o /tmp/betterleaks_1.9.0_linux_x64.tar.gz
          curl -fsSL https://github.com/Betterleaks/betterleaks/releases/download/v1.9.0/checksums.txt -o /tmp/checksums.txt
          (cd /tmp && grep betterleaks_1.9.0_linux_x64.tar.gz checksums.txt | sha256sum -c -)
          sudo tar -xzf /tmp/betterleaks_1.9.0_linux_x64.tar.gz -C /usr/local/bin betterleaks
      - run: betterleaks git .

  unit:
    name: ruff and compat2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: >-
          uv run ruff format --check
          --exclude src/pyscriptc
          --exclude benchmarks/compat/score.py
          --exclude .agents/docs/loop.md
          --exclude benchmarks/runtime/workloads/pow_loop.py
          --exclude benchmarks/runtime/workloads/tuple_membership.py
          --exclude benchmarks/compat2/bundle.py
          --exclude benchmarks/compat2/cache.py
          --exclude benchmarks/compat2/corpus/spec.py
          --exclude benchmarks/compat2/coverage_map.py
          --exclude benchmarks/compat2/score.py
      - name: oracle is CPython 3.14
        run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
      - run: uv run pytest -q tests/compat2 -m "not linux_container"

  macos-safe:
    name: tests without linux_container (shard ${{ matrix.group }}/3)
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      # pytest-split shards by recorded durations (tests/.test_durations), xdist parallelises inside a shard.
      # Refresh with: uv run pytest -n 6 -m "not linux_container" --store-durations --durations-path tests/.test_durations
      - run: uv run pytest -q tests --ignore=tests/compat2 -m "not linux_container" -n auto --splits 3 --group ${{ matrix.group }} --durations-path tests/.test_durations

  zig-smoke:
    name: zig cc emitted-IR smoke (${{ matrix.zig }})
    runs-on: ubuntu-24.04
    # Supported zig range (packaging/TOOLCHAIN.md): >= 0.13 claimed, CI-verified
    # floor and ceiling pinned here. Adding a version: pin its sha256 from
    # https://ziglang.org/download/index.json and extend this matrix.
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.16.0", "0.17.0"]
    steps:
      - uses: actions/checkout@v5
      - name: Cache zig tarball
        uses: actions/cache@v5
        with:
          path: /tmp/zig-${{ matrix.zig }}.tar.xz
          key: zig-${{ matrix.zig }}-x86_64-linux
      - name: Install zig ${{ matrix.zig }}
        run: |
          set -euo pipefail
          version="${{ matrix.zig }}"
          case "$version" in
            0.16.0) sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00" ;;
            0.17.0) sha="1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026" ;;
            *) echo "no pinned sha256 for zig $version" >&2; exit 1 ;;
          esac
          [ -f "/tmp/zig-$version.tar.xz" ] || \
            curl -fsSL "https://ziglang.org/download/$version/zig-x86_64-linux-$version.tar.xz" -o "/tmp/zig-$version.tar.xz"
          echo "$sha  /tmp/zig-$version.tar.xz" | sha256sum -c -
          sudo tar -xJf "/tmp/zig-$version.tar.xz" -C /usr/local
          echo "/usr/local/zig-x86_64-linux-$version" >> "$GITHUB_PATH"
      - name: Install qemu-user-static (run aarch64/riscv64 musl binaries)
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run: packaging/zig/smoke.sh

  # The `pip install ziglang` path: the wheel ships the zig binary but only
  # exposes a `python-zig` console script, so `which("zig")` misses it.
  # pyscriptc installs a `zig` PATH shim that runs `python -m ziglang`;
  # this job proves that a wheel-only install can cross-compile.
  ziglang-wheel:
    name: ziglang wheel PATH shim
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Install the ziglang wheel (no zig on PATH)
        run: uv pip install --python .venv ziglang==0.17.0
      - name: The shim resolves and cross-compiles
        run: |
          set -euo pipefail
          # No zig on PATH at this point: the wheel is the only source.
          uv run python -c "
          from pyscriptc import zigshim
          import shutil, sys
          path = zigshim.resolve_zig()
          assert path, 'zig did not resolve from the ziglang wheel'
          zigshim.ensure_on_path()
          assert shutil.which('zig'), 'zig is not on PATH after the shim'
          print('zig resolved:', shutil.which('zig'))
          "
          uv run pyscriptc compile examples/hello.py --emit bin --skip-check \
            --driver zig --target x86_64-linux-musl -o /tmp/hello-musl
          file /tmp/hello-musl

  # Wheel smoke: build the wheel, install it into a fresh venv, and compile a
  # tiny program with the repo venv and pyrefly dirs off PATH. Same shape as
  # the verify job in release.yml. On pull_request the job runs only when the
  # diff touches the compiler entry points, pyproject.toml, or packaging/.
  # Pushes to any branch always run it.
  wheel-smoke:
    name: wheel install smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          if grep -Eq '^(src/pyscriptc/(check|typefacts|cli)\.py|pyproject\.toml|packaging/)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.paths.outputs.run == 'true'
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"

      - name: Stamp PostHog token
        if: steps.paths.outputs.run == 'true'
        env:
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: printf 'TOKEN = "%s"\n' "$POSTHOG_PROJECT_TOKEN" > src/pyscriptc/_posthog_token.py

      - name: Build sdist and wheel
        if: steps.paths.outputs.run == 'true'
        run: uv build

      - name: Install clang
        if: steps.paths.outputs.run == 'true'
        run: |
          set -euo pipefail
          command -v clang >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq clang; }

      - name: Fresh venv, install wheel, compile and run fixture
        if: steps.paths.outputs.run == 'true'
        env:
          WORK: ${{ runner.temp }}/wheel-smoke
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          wheel="$(ls dist/pyscriptc-*-any.whl)"
          uv venv "$WORK/venv"
          uv pip install --python "$WORK/venv/bin/python" "$wheel"
          printf 'def main() -> None:\n    print("hello")\n' > "$WORK/hello.py"
          # Repo venv and pyrefly dirs are off PATH on purpose.
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/local/bin \
            "$WORK/venv/bin/pyscriptc" compile "$WORK/hello.py" --emit bin -o "$WORK/hello-bin"
          out="$("$WORK/hello-bin")"
          echo "$out"
          [ "$out" = "hello" ]

  # ASan+UBSan smoke: compile a small program with --sanitize=address,undefined
  # and run it. The sanitizer runtime must stay silent: any reported error or
  # nonzero exit fails the job. Covers the C runtime and the emitted code.
  sanitize-smoke:
    name: ASan+UBSan smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Install clang (sanitizer runtime)
        run: |
          set -euo pipefail
          command -v clang >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq clang; }
      - name: Compile with --sanitize and run
        env:
          WORK: ${{ runner.temp }}/sanitize-smoke
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          cat > "$WORK/hello.py" <<'PY'
          def main() -> None:
              xs: list[int] = [1, 2, 3]
              total: int = 0
              for x in xs:
                  total = total + x
              print("total", total)


          if __name__ == "__main__":
              main()
          PY
          uv run pyscriptc compile "$WORK/hello.py" --emit bin -o "$WORK/hello-san" --sanitize=address,undefined
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            "$WORK/hello-san" 2> "$WORK/sanitizer.err" | tee "$WORK/out.txt"
          out="$(cat "$WORK/out.txt")"
          [ "$out" = "total 6" ]
          [ ! -s "$WORK/sanitizer.err" ] || { cat "$WORK/sanitizer.err"; exit 1; }
      - name: Sanitizer also passes the local test
        run: uv run pytest -q tests/test_sanitize.py -m "not linux_container"

  # TSan smoke: the thread sanitizer on the programs that exercise the
  # runtime's thread primitives. TSan cannot share a process with ASan, so
  # this is its own job. A report is a data race the compiler introduced or a
  # thread the runtime leaked, so the runtime has to stay silent.
  tsan-smoke:
    name: TSan smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Install clang (TSan runtime)
        run: |
          set -euo pipefail
          command -v clang >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq clang; }
      - name: Compile the thread programs with --sanitize=thread and run
        env:
          WORK: ${{ runner.temp }}/tsan-smoke
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          cat > "$WORK/count.py" <<'PY'
          import threading

          count = 0
          lock: threading.Lock = threading.Lock()

          def bump(n: int) -> None:
              global count
              i: int = 0
              while i < n:
                  lock.acquire()
                  count = count + 1
                  lock.release()
                  i = i + 1

          def checklist() -> int:
              a: threading.Thread = threading.Thread(target=bump, args=(200000,))
              b: threading.Thread = threading.Thread(target=bump, args=(200000,))
              c: threading.Thread = threading.Thread(target=bump, args=(200000,))
              d: threading.Thread = threading.Thread(target=bump, args=(200000,))
              a.start()
              b.start()
              c.start()
              d.start()
              a.join()
              b.join()
              c.join()
              d.join()
              if count != 800000:
                  return 1
              return 0
          PY
          uv run pyscriptc compile "$WORK/count.py" --emit bin -o "$WORK/count-tsan" --call checklist --args "[]" --sanitize=thread
          TSAN_OPTIONS="halt_on_error=1:exitcode=66" "$WORK/count-tsan" > "$WORK/out.txt" 2> "$WORK/tsan.err"
          [ "$(cat "$WORK/out.txt")" = "0" ]
          [ ! -s "$WORK/tsan.err" ] || { cat "$WORK/tsan.err"; exit 1; }
      - name: TSan suite passes locally
        run: uv run pytest -q tests/test_threading_tsan.py -m "linux_container"
