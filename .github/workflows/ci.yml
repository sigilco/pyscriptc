name: ci

on:
  push:
    branches: [master]
  pull_request:
    # The nightly compat snapshot PR (branch bot/compat-snapshot) is
    # data-only and authored by github-actions[bot]; a pull_request run of
    # this workflow from that branch is held at action_required until an
    # owner approves it, which wedges the nightly. The nightly validates
    # the snapshot itself (the site workflow is called through
    # workflow_call, and the compat seams run as a test step), and this
    # workflow has no required context on the bot PR, so nothing is lost.
    branches-ignore:
      - bot/compat-snapshot

# A PR branch push used to run twice (push and pull_request) and every new
# commit queued behind the previous one. PRs run once and a newer commit
# cancels the old run. `push` is limited to master, so a branch push no
# longer runs the workflow at all: the pull_request event covers the
# branch, and master keeps the full matrix.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Path gating (see .agents/notes/2026-10-28-ci-path-gating.md).
#
# The `changes` job classifies the diff and every other job reads its
# outputs through `needs.changes.outputs.<group>`. A job that is skipped by
# `if:` reports as skipped, which counts as passing for a required check, so
# no required check ever blocks a merge by being absent. A workflow-level
# `paths:` filter would leave a required check pending instead, which blocks
# the merge forever, so the filtering is done at job level on purpose.
#
# The classification is deliberately coarse. Anything that can change a
# compiled artifact, a test result or the toolchain runs the full matrix:
# src/, tests/, benchmarks/, examples/, scripts/, packaging/, docker/, the
# runtime C, pyproject.toml, uv.lock, mise.toml, .github/, .claude/ and
# .agents/docs/ (each because a test reads it). Only the documentation
# bubble can skip the expensive lanes: docs/, apps/web/, .agents/notes/ and
# the pnpm lockfile.
#
# Three groups, one always-on check:
#
#   compiler  everything that can move a test or compile result (the list
#             above); drives the 9 expensive lanes
#   python    any tracked Python file; drives `ruff and compat2`, because
#             ruff lints the whole tree (688 files), not only src/
#   site      docs/, apps/web/, data/ and the pnpm lockfiles; drives the
#             `docs seams` job (the five doc-coupled unit tests)
#   betterleaks runs on every event; a secret can be in any file
#
# `push` to master always runs the full matrix: the ruleset is evaluated on
# the merge commit, and a skipped lane on master would leave master without
# the receipt the release rehearsal expects. The one push exception is the
# empty commit ("chore: retrigger build"): an empty diff has nothing to
# test, so only betterleaks runs.
#
# `linux_container` is the Linux dev container suite:
# HEAVY=1 docker/run.sh
# Those tests shell out to clang or only pass on Linux. The shard jobs do
# not run that marker; the TSan job does, because the thread sanitizer is
# clang-only and needs its own process (it cannot share one with ASan).
# The workflow still does not run the heavy container, the full compiler
# suite, or probe calibration.
#
# ruff format skips src/pyscriptc, the frozen v1 scorer, loop.md, and two
# workload files. Those still fail format under ruff 0.17; reformatting them
# is not part of this workflow.
# Linux (unit): ruff plus compat2 under tests/compat2.
# macOS (macos-safe): the rest of the test tree on macos-14, excluding
# compat2 and any test marked linux_container.
#
# These steps run the raw commands, not `mise run <task>`, even though mise is
# the default task runner locally. Two reasons. First, `mise.toml` pins
# `uv = "latest"` while CI must hold the `>= 0.13.4` uv floor from the emSign
# CA incident, so routing through mise would change which uv the checks run
# under. Second, `mise install` plus a mise-action step per job buys nothing
# over the existing setup-uv and setup-node steps, which are already cached.
# The job names and the required check names stay as they are either way,
# since the commands are identical.

jobs:
  changes:
    name: classify paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      compiler: ${{ steps.classify.outputs.compiler }}
      python: ${{ steps.classify.outputs.python }}
      site: ${{ steps.classify.outputs.site }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify the changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Pushes are conservative: any real change runs the full matrix
          # (master receipt, see header). The one exception is the empty
          # push ("chore: retrigger build"): an empty diff has nothing to
          # test, so only betterleaks runs. GITHUB_EVENT_BEFORE is absent
          # or unknown on some events; then the diff is treated as
          # non-empty, which is the safe direction.
          # pull_request classify the PR diff. The head sha of a
          # cross-fork PR is not in the checkout, hence the fallback.
          if [ "$EVENT" != "pull_request" ]; then
            compiler=true
            python=true
            before="${GITHUB_EVENT_BEFORE:-}"
            if [ -n "$before" ] && git cat-file -e "$before" 2>/dev/null; then
              if [ -z "$(git diff --name-only "$before" "$GITHUB_SHA")" ]; then
                compiler=false
                python=false
              fi
            fi
            {
              echo "compiler=$compiler"
              echo "python=$python"
              echo "site=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Resolve the head sha. A pull_request from a fork does not have
          # the head commit in the checkout, so it is fetched explicitly.
          # If neither works, the diff is taken against the merge base of
          # what is there, which is the conservative direction (a wider
          # diff can only run more lanes).
          head_sha=""
          for candidate in "$HEAD" "FETCH_HEAD"; do
            if [ -n "$candidate" ] && git cat-file -e "$candidate" 2>/dev/null; then
              head_sha="$candidate"
              break
            fi
          done
          if [ -z "$head_sha" ]; then
            git fetch --no-tags --depth=1 origin "$HEAD" 2>/dev/null || true
            if git cat-file -e "$HEAD" 2>/dev/null; then head_sha="$HEAD"; fi
          fi
          if [ -z "$head_sha" ]; then
            echo "::warning::the head sha is not in the checkout; diffing against the merge base"
            base_sha="$(git merge-base "$BASE" HEAD 2>/dev/null || echo "$BASE")"
            changed="$(git diff --name-only "$base_sha" HEAD)"
          else
            changed="$(git diff --name-only "$BASE" "$head_sha")"
          fi
          # Site inputs: docs, the web app, the canonical data the site
          # assembles, and the lockfiles the pnpm install needs.
          if grep -Eq '^(docs/|apps/web/|data/|pnpm-lock\.yaml)' <<<"$changed"; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi
          # The documentation bubble: paths that never change a compiled
          # artifact or a test result. Everything outside it forces the
          # full matrix, so tooling (.github/), deps (pyproject.toml,
          # uv.lock) and the compiler (src/) are conservative by default.
          #
          # These are deliberately NOT in the bubble, because a test reads
          # them and a change there moves a test result:
          #
          #   .github/           tests/test_compat_site.py reads site.yml
          #                       and nightly.yml, test_release_bar.py
          #                       reads .github/scripts/
          #   .claude/           tests/test_holdout_guard.py reads
          #                       .claude/hooks/holdout_guard.py
          #   .agents/docs/      scripts/gen_support_table.py reads
          #                       .agents/docs/support/, and
          #                       scripts/check_doc_cadence.py scans it
          #   data/              tests/test_compat_site.py and
          #                       test_compat_json.py read data/compat/
          #
          # Only the prose under .agents/ (notes/, plans/) and the probe
          # scripts under .agents/probes/ are free: no test reads them.
          # The probes are Python, so they land in the lint lane below.
          bubble='^(docs/|apps/web/|\.agents/(notes|plans|probes)/|pnpm-lock\.yaml|\.github/(ISSUE_TEMPLATE|pull_request_template)|LICENSE|NOTICE|\.gitignore)'
          if [ -z "$changed" ]; then
            # Empty commit: nothing to test, nothing to lint.
            compiler=false python=false
          elif grep -Evq "$bubble" <<<"$changed"; then
            compiler=true python=true
          elif grep -Eq '\.py$' <<<"$changed"; then
            # Inside the bubble but Python moved: .agents/probes/*.py.
            # Ruff lints them, so run the lint lane. The compiler lane
            # stays off: no test reads them.
            compiler=false python=true
          else
            compiler=false python=false
          fi
          {
            echo "compiler=$compiler"
            echo "python=$python"
          } >> "$GITHUB_OUTPUT"


  # Aggregators for the required check names. The ruleset (`master: PR
  # only`) requires the literal contexts `tests without linux_container
  # (shard N/3)` for N in 1..3 and `zig cc emitted-IR smoke`, and required
  # status checks match the reported name exactly. Two problems with the
  # real lanes, both verified on throwaway PRs #750 and #751:
  #
  # 1. The shard and zig jobs are matrix cells, so their reported names end
  #    in the matrix value (`(shard 1/3)`, `(0.16.0)`) and the bare names
  #    the ruleset expects never arrive.
  # 2. A job-level `if:` skip on a matrix job reports a single `skipped`
  #    check run whose name keeps the literal `${{ matrix.* }}` text
  #    unrendered (`tests without linux_container (shard ${{ matrix.group
  #    }}/3)`). A non-matrix job, by contrast, reports its own rendered
  #    name. So on a docs-only pull request no shard name is reported at
  #    all and the merge sits waiting forever.
  #
  # These two jobs always run and fan out over the same groups as the real
  # lanes, so their rendered names are exactly the required contexts. Each
  # leg passes when the corresponding lane was green or correctly skipped,
  # and fails when it failed. A cancelled lane fails the leg and the
  # workflow, which is the safe direction for a required check.
  shard-ok:
    name: tests without linux_container (shard ${{ matrix.group }}/3)
    runs-on: ubuntu-latest
    needs: macos-safe
    if: always()
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - name: The shard is green or correctly skipped
        env:
          RESULT: ${{ needs.macos-safe.result }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success|skipped) echo "shard $GROUP/3: $RESULT" ;;
            *) echo "shard $GROUP/3: $RESULT" >&2; exit 1 ;;
          esac

  zig-ok:
    name: zig cc emitted-IR smoke
    runs-on: ubuntu-latest
    needs: zig-smoke
    if: always()
    steps:
      - name: The zig smoke is green or correctly skipped
        env:
          RESULT: ${{ needs.zig-smoke.result }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success|skipped) echo "zig smoke: $RESULT" ;;
            *) echo "zig smoke: $RESULT" >&2; exit 1 ;;
          esac

  # Fail-closed aggregate. Green only when the classifier succeeded and no
  # lane that ran failed. It is the one check an admin would make required
  # (see .agents/notes/2026-10-28-ci-path-gating.md): a single stable
  # context that is green only when the lanes that mattered were green.
  #
  # It does not replace the per-lane required contexts today: those stay
  # required, and a job skipped by `if:` reports "skipped", which counts as
  # success for a required check, so no lane blocks a merge by being absent.
  #
  # The skipped-lane rule is the hole: a lane that was skipped because the
  # classifier decided it was irrelevant also reports "skipped". That is
  # safe here because the classifier only skips lanes the change cannot
  # affect. It would not be safe for a lane that must always run, which is
  # why this job checks the classifier's own result rather than trusting the
  # per-lane conclusions alone.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs:
      - changes
      - shard-ok
      - zig-ok
      - docs-seams
      - secrets
      - unit
      - macos-safe
      - zig-smoke
      - ziglang-wheel
      - wasm-smoke
      - wheel-smoke
      - sanitize-smoke
      - tsan-smoke
      - mobile-archives
      - network-receipt
    if: always()
    steps:
      - name: Collect the lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" > lane-results.json
          echo "lane results: $RESULTS"
      - name: Fail if the classifier or any lane failed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys

          needs = json.load(open("lane-results.json"))
          # The classifier must have succeeded: if it failed, every lane was
          # skipped and the run would otherwise look green.
          problems = []
          if needs["changes"]["result"] != "success":
              problems.append(f"changes: {needs['changes']['result']}")
          # The two aggregators are the required contexts and are never
          # skipped (if: always()), so they must be strictly green. Their
          # legs already failed if the lane underneath failed, so this adds
          # no new failure mode, it just refuses to paper over one.
          for job in ("shard-ok", "zig-ok"):
              if needs[job]["result"] != "success":
                  problems.append(f"{job}: {needs[job]['result']}")
          for job, info in needs.items():
              if job in ("changes", "shard-ok", "zig-ok"):
                  continue
              result = info["result"]
              # "skipped" means the classifier ruled the lane irrelevant.
              # "success" is the pass. Anything else is a real failure.
              if result not in ("success", "skipped"):
                  problems.append(f"{job}: {result}")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}", file=sys.stderr)
              sys.exit(1)
          print("all lanes green")
          PY

  # The documentation seams: the unit tests that read the docs and the
  # canonical data tree. They are cheap (no compiler, no network) but they
  # are real gates on the doc bubble: the compat contract, the support
  # table, the doc cadence rule and the first-class-scripts page. Without
  # this lane a docs-only PR would skip every test in this workflow.
  docs-seams:
    name: docs seams
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.site == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - name: The doc and data seams pass
        run: >-
          uv run pytest -q
          tests/test_compat_site.py
          tests/test_compat_json.py
          tests/test_doc_cadence.py
          tests/test_support_docs.py
          -m "not linux_container"

  secrets:
    # Required context `betterleaks`. This job never has an `if:`, so the
    # name always reports from a real run. No aggregator needed.
    name: betterleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install betterleaks 1.9.0
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/Betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz -o /tmp/betterleaks_1.9.0_linux_x64.tar.gz
          curl -fsSL https://github.com/Betterleaks/betterleaks/releases/download/v1.9.0/checksums.txt -o /tmp/checksums.txt
          (cd /tmp && grep betterleaks_1.9.0_linux_x64.tar.gz checksums.txt | sha256sum -c -)
          sudo tar -xzf /tmp/betterleaks_1.9.0_linux_x64.tar.gz -C /usr/local/bin betterleaks
      - run: betterleaks git .

  unit:
    # Required context `ruff and compat2`. Not a matrix job, so a
    # classifier skip reports this exact name as `skipped`, which
    # satisfies a required check (verified on #750/#751). No aggregator.
    name: ruff and compat2
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: >-
          uv run ruff format --check
          --exclude src/pyscriptc
          --exclude benchmarks/compat/score.py
          --exclude .agents/docs/loop.md
          --exclude benchmarks/runtime/workloads/pow_loop.py
          --exclude benchmarks/runtime/workloads/tuple_membership.py
          --exclude benchmarks/compat2/bundle.py
          --exclude benchmarks/compat2/cache.py
          --exclude benchmarks/compat2/corpus/spec.py
          --exclude benchmarks/compat2/coverage_map.py
          --exclude benchmarks/compat2/score.py
      - name: oracle is CPython 3.14
        run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
      - run: uv run pytest -q tests/compat2 -m "not linux_container"
  macos-safe:
    # The real shard lane. The name carries the matrix value, so it never
    # matches the required context `tests without linux_container (shard
    # N/3)` on its own: the `shard-ok` aggregator above reports that name.
    name: unit shard ${{ matrix.group }}/3
    runs-on: macos-14
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      # pytest-split shards by recorded durations (tests/.test_durations), xdist parallelises inside a shard.
      # Refresh with: uv run pytest -n 6 -m "not linux_container" --store-durations --durations-path tests/.test_durations
  zig-smoke:
    # The real zig lane. The name carries the zig version, so it never
    # matches the required context `zig cc emitted-IR smoke` on its own:
    # the `zig-ok` aggregator above reports that name.
    name: zig smoke (${{ matrix.zig }})
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    # Supported zig range (packaging/TOOLCHAIN.md): >= 0.13 claimed, CI-verified
    # floor and ceiling pinned here. Adding a version: pin its sha256 from
    # https://ziglang.org/download/index.json and extend this matrix.
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.16.0", "0.17.0"]
    steps:
      - uses: actions/checkout@v5
      - name: Cache zig tarball
        uses: actions/cache@v5
        with:
          path: /tmp/zig-${{ matrix.zig }}.tar.xz
          key: zig-${{ matrix.zig }}-x86_64-linux
      - name: Install zig ${{ matrix.zig }}
        run: |
          set -euo pipefail
          version="${{ matrix.zig }}"
          case "$version" in
            0.16.0) sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00" ;;
            0.17.0) sha="1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026" ;;
            *) echo "no pinned sha256 for zig $version" >&2; exit 1 ;;
          esac
          [ -f "/tmp/zig-$version.tar.xz" ] || \
            curl -fsSL "https://ziglang.org/download/$version/zig-x86_64-linux-$version.tar.xz" -o "/tmp/zig-$version.tar.xz"
          echo "$sha  /tmp/zig-$version.tar.xz" | sha256sum -c -
          sudo tar -xJf "/tmp/zig-$version.tar.xz" -C /usr/local
          echo "/usr/local/zig-x86_64-linux-$version" >> "$GITHUB_PATH"
      - name: Install qemu-user-static (run aarch64/riscv64 musl binaries)
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run: packaging/zig/smoke.sh

  # The `pip install ziglang` path: the wheel ships the zig binary but only
  # exposes a `python-zig` console script, so `which("zig")` misses it.
  # pyscriptc installs a `zig` PATH shim that runs `python -m ziglang`;
  # this job proves that a wheel-only install can cross-compile.
  ziglang-wheel:
    name: ziglang wheel PATH shim
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Install the ziglang wheel (no zig on PATH)
        run: uv pip install --python .venv ziglang==0.17.0
      - name: The shim resolves and cross-compiles
        run: |
          set -euo pipefail
          # No zig on PATH at this point: the wheel is the only source.
          uv run python -c "
          from pyscriptc import zigshim
          import shutil, sys
          path = zigshim.resolve_zig()
          assert path, 'zig did not resolve from the ziglang wheel'
          zigshim.ensure_on_path()
          assert shutil.which('zig'), 'zig is not on PATH after the shim'
          print('zig resolved:', shutil.which('zig'))
          "
          uv run pyscriptc compile examples/hello.py --emit bin --skip-check \
            --driver zig --target x86_64-linux-musl -o /tmp/hello-musl
          file /tmp/hello-musl


  # wasm smoke: compile the wasm32-wasi-musl target and run it under wasmtime.
  # try/except lowers through the WebAssembly exception-handling proposal, so
  # the runtime must be wasmtime >= v50; older runtimes fail with "exceptions
  # proposal not enabled".
  # continue-on-error while the lane settles; it becomes required once it has
  # been green for 3 consecutive runs.
  wasm-smoke:
    name: wasm32-wasi-musl smoke
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Cache zig tarball
        uses: actions/cache@v5
        with:
          path: /tmp/zig.tar.xz
          key: zig-0.16.0-x86_64-linux
      - name: Install zig 0.16.0
        run: |
          set -euo pipefail
          [ -f /tmp/zig.tar.xz ] || \
            curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/zig.tar.xz -C /usr/local
          echo "/usr/local/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Install wasmtime v50.0.0
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.0/wasmtime-v50.0.0-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp
          echo "/tmp/wasmtime-v50.0.0-x86_64-linux" >> "$GITHUB_PATH"
      # The 0.2 lane: wasm-tools wraps the p1 core module into a component,
      # using the preview1 adapter that ships in the wasmtime release. The
      # compiler fetches and sha256-verifies the adapter itself.
      - name: Install wasm-tools 1.262.0
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.262.0/wasm-tools-1.262.0-x86_64-linux.tar.gz -o /tmp/wasm-tools.tar.gz
          tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
          echo "/tmp/wasm-tools-1.262.0-x86_64-linux" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - run: packaging/zig/wasm-smoke.sh

  # Wheel smoke: build the wheel, install it into a fresh venv, and compile a
  # tiny program with the repo venv and pyrefly dirs off PATH. Same shape as
  # the verify job in release.yml. It proves the wheel installs, so it runs
  # whenever the full matrix runs (pushes always, PRs with any non-docs
  # change). This is the job whose check name is required on master; the
  # `if:` skip reports as skipped, which satisfies the ruleset without a
  # workflow-level path filter that would leave the check unreported.
  wheel-smoke:
    name: wheel install smoke
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"

      - name: Stamp PostHog token
        env:
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: printf 'TOKEN = "%s"\n' "$POSTHOG_PROJECT_TOKEN" > src/pyscriptc/_posthog_token.py

      - name: Build sdist and wheel
        run: uv build

      - name: Install clang
        run: |
          set -euo pipefail
          command -v clang >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq clang; }

      - name: Fresh venv, install wheel, compile and run fixture
        env:
          WORK: ${{ runner.temp }}/wheel-smoke
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          wheel="$(ls dist/pyscriptc-*-any.whl)"
          uv venv "$WORK/venv"
          uv pip install --python "$WORK/venv/bin/python" "$wheel"
          printf 'def main() -> None:\n    print("hello")\n' > "$WORK/hello.py"
          # Repo venv and pyrefly dirs are off PATH on purpose.
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/local/bin \
            "$WORK/venv/bin/pyscriptc" compile "$WORK/hello.py" --emit bin -o "$WORK/hello-bin"
          out="$("$WORK/hello-bin")"
          echo "$out"
          [ "$out" = "hello" ]

  # ASan+UBSan smoke: compile a small program with --sanitize=address,undefined
  # and run it. The sanitizer runtime must stay silent: any reported error or
  # nonzero exit fails the job. Covers the C runtime and the emitted code.
  sanitize-smoke:
    name: ASan+UBSan smoke
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Install clang (sanitizer runtime)
        run: |
          set -euo pipefail
          command -v clang >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq clang; }
      - name: Compile with --sanitize and run
        env:
          WORK: ${{ runner.temp }}/sanitize-smoke
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          cat > "$WORK/hello.py" <<'PY'
          def main() -> None:
              xs: list[int] = [1, 2, 3]
              total: int = 0
              for x in xs:
                  total = total + x
              print("total", total)


          if __name__ == "__main__":
              main()
          PY
          uv run pyscriptc compile "$WORK/hello.py" --emit bin -o "$WORK/hello-san" --sanitize=address,undefined
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            "$WORK/hello-san" 2> "$WORK/sanitizer.err" | tee "$WORK/out.txt"
          out="$(cat "$WORK/out.txt")"
          [ "$out" = "total 6" ]
          [ ! -s "$WORK/sanitizer.err" ] || { cat "$WORK/sanitizer.err"; exit 1; }
      - name: Sanitizer also passes the local test
        run: uv run pytest -q tests/test_sanitize.py -m "not linux_container"

  # TSan smoke: the thread sanitizer on the programs that exercise the
  # runtime's thread primitives. TSan cannot share a process with ASan, so
  # this is its own job. A report is a data race the compiler introduced or a
  # thread the runtime leaked, so the runtime has to stay silent.
  tsan-smoke:
    name: TSan smoke
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Install clang (TSan runtime)
        run: |
          set -euo pipefail
          command -v clang >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq clang; }
      - name: Compile the thread programs with --sanitize=thread and run
        env:
          WORK: ${{ runner.temp }}/tsan-smoke
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          cat > "$WORK/count.py" <<'PY'
          import threading

          count = 0
          lock: threading.Lock = threading.Lock()

          def bump(n: int) -> None:
              global count
              i: int = 0
              while i < n:
                  lock.acquire()
                  count = count + 1
                  lock.release()
                  i = i + 1

          def checklist() -> int:
              a: threading.Thread = threading.Thread(target=bump, args=(200000,))
              b: threading.Thread = threading.Thread(target=bump, args=(200000,))
              c: threading.Thread = threading.Thread(target=bump, args=(200000,))
              d: threading.Thread = threading.Thread(target=bump, args=(200000,))
              a.start()
              b.start()
              c.start()
              d.start()
              a.join()
              b.join()
              c.join()
              d.join()
              if count != 800000:
                  return 1
              return 0
          PY
          uv run pyscriptc compile "$WORK/count.py" --emit bin -o "$WORK/count-tsan" --call checklist --args "[]" --sanitize=thread
          # The report has to reach the log even when the binary exits with the
          # sanitizer exit code, so the exit status is captured, not propagated.
          set +e
          TSAN_OPTIONS="halt_on_error=1:exitcode=66" "$WORK/count-tsan" > "$WORK/out.txt" 2> "$WORK/tsan.err"
          status=$?
          set -e
          cat "$WORK/tsan.err"
          [ "$status" -eq 0 ] || { echo "the sanitized binary exited $status"; exit 1; }
          [ "$(cat "$WORK/out.txt")" = "0" ]
          [ ! -s "$WORK/tsan.err" ] || { cat "$WORK/tsan.err"; exit 1; }
      - name: TSan suite passes locally
        run: uv run pytest -q tests/test_threading_tsan.py -m "linux_container"

  # The mobile static-library mode (#356): build all three archives and
  # link-check them. Apple legs run on macos-14 (Xcode SDKs are preinstalled);
  # the Android leg downloads the pinned NDK. The simulator runner cannot
  # execute outside the simulator runtime, so linking is the check there.
  mobile-archives:
    name: mobile archives and link-checks
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            skip: android
            ndk: ""
          - os: ubuntu-24.04
            skip: "ios-sim,ios-device"
            ndk: "28.2.13676358"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Install the Android NDK r28c
        if: matrix.ndk != ''
        run: |
          set -euo pipefail
          zip=/tmp/android-ndk-r28c-linux.zip
          curl -fsSL https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -o "$zip"
          echo "a7b54a5de87fecd125a17d54f73c446199e72a64  $zip" | sha1sum -c -
          unzip -q "$zip" -d /opt
          echo "PYSC_ANDROID_NDK=/opt/android-ndk-r28c" >> "$GITHUB_ENV"
      - name: Build the mobile archives and link-check them
        run: PYSC_SMOKE_SKIP=${{ matrix.skip }} packaging/mobile/smoke.sh

  # The library receipt (#409): a deps-driven certifi program compiles and
  # matches CPython. Opt-in lane: the differential test is skipped without
  # PYSC_NETWORK_TESTS=1, so the shards above never touch PyPI through it.
  network-receipt:
    name: network receipt (certifi library receipt)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Install clang
        run: |
          set -euo pipefail
          command -v clang >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq clang; }
      - name: The certifi receipt compiles and matches CPython
        env:
          PYSC_NETWORK_TESTS: "1"
        run: uv run pytest -q tests/test_deps_receipt.py
