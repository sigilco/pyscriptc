name: ci

on:
  push:
  pull_request:

# `linux_container` is the Linux dev container suite:
# HEAVY=1 .agents/docker/run.sh
# Those tests shell out to clang or only pass on Linux. This workflow does
# not run that marker, and it does not run the heavy container, the full
# compiler suite, or probe calibration.
#
# ruff format skips src/pyscriptc, the frozen v1 scorer, loop.md, and two
# workload files. Those still fail format under ruff 0.17; reformatting them
# is not part of this workflow.
# Linux (unit): ruff plus compat2 under tests/compat2.
# macOS (macos-safe): the rest of the test tree on macos-14, excluding
# compat2 and any test marked linux_container.

jobs:
  secrets:
    name: betterleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install betterleaks 1.9.0
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/Betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz -o /tmp/betterleaks_1.9.0_linux_x64.tar.gz
          curl -fsSL https://github.com/Betterleaks/betterleaks/releases/download/v1.9.0/checksums.txt -o /tmp/checksums.txt
          (cd /tmp && grep betterleaks_1.9.0_linux_x64.tar.gz checksums.txt | sha256sum -c -)
          sudo tar -xzf /tmp/betterleaks_1.9.0_linux_x64.tar.gz -C /usr/local/bin betterleaks
      - run: betterleaks git .

  unit:
    name: ruff and compat2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: >-
          uv run ruff format --check
          --exclude src/pyscriptc
          --exclude benchmarks/compat/score.py
          --exclude .agents/docs/loop.md
          --exclude benchmarks/runtime/workloads/pow_loop.py
          --exclude benchmarks/runtime/workloads/tuple_membership.py
      - run: uv run pytest -q tests/compat2 -m "not linux_container"

  macos-safe:
    name: tests without linux_container
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run pytest -q tests --ignore=tests/compat2 -m "not linux_container"

  zig-smoke:
    name: zig cc emitted-IR smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install zig 0.16.0
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/zig.tar.xz -C /usr/local
          echo "/usr/local/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Install qemu-user-static (run aarch64/riscv64 musl binaries)
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run: packaging/zig/smoke.sh
