# Embed CI jobs (#662): the empty-environment acceptance slice for the
# bundled CPython runtime (issues #657 to #665, epic #428; maintenance doc:
# .agents/docs/release/embed-runtime.md). Matrix: Linux x86_64 on
# ubuntu-24.04 (glibc 2.39) and macOS arm64 on macos-14. A Linux aarch64 cell
# is a stretch, not in this matrix yet.
#
# Pull requests run the jobs path-filtered on the files the embedding work
# touches; pushes to master, the nightly schedule and the release rehearsal
# (workflow_dispatch with always_run=true) run them unconditionally. Merging
# a runtime bump PR (runtime-bump.yml) requires these jobs green.
#
# Runner minutes budget (issue #662): target 4 minutes per cell, hard
# timeout 6, 2 cells per full run, so a full run costs at most about 12
# runner minutes (about 8 Linux + about 10 macOS rate-equivalent, macOS
# minutes cost 10x Linux on free plans). Measured: recorded in issue #662 at
# close. The macOS PR cell drops to nightly and rehearsal only by setting the
# repo variable EMBED_PR_SKIP_MACOS=true - no code change needed.
#
# Nightly versus per-PR split: pull requests run path-filtered on the
# embedding surface (the gate step below); the nightly schedule, pushes to
# master and the release rehearsal (workflow_dispatch always_run=true) run
# both cells unconditionally.
#
# The acceptance matrix is the real headline test (issue #661): three
# programs (stdlib-only island fractions, a bundled pure-Python dependency,
# a program reading a staged data file) are compiled into bundles, the
# bundles are relocated, the pack cache is moved away and the repository
# checkout is renamed away, and each bundle runs under `env -i` (no PATH, no
# HOME, no PYTHONHOME) compared against CPython's stdout, stderr and exit
# code. The loader assertions pin the relative rpath only.
name: embed

on:
  push:
    branches: [master]
  schedule:
    - cron: "43 6 * * *" # nightly, after the score run
  workflow_dispatch:
    inputs:
      always_run:
        description: "Run unconditionally (release rehearsal)"
        type: boolean
        default: false
  pull_request:
    # The nightly compat snapshot PR (bot/compat-snapshot) is data-only;
    # its pull_request runs would sit at action_required waiting for an
    # owner (see ci.yml). The nightly covers it: the schedule run executes
    # these jobs on master before the PR is even opened.
    branches-ignore:
      - bot/compat-snapshot
permissions:
  contents: read

concurrency:
  group: embed-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the PR diff before touching the paid matrix. The gate step
  # inside `acceptance` used to do this, which still bought a runner cell
  # (macOS minutes bill at 10x) per PR just to print "run=false". The
  # matrix cells now gate on this job's output through `if:` and report
  # "skipped" (which passes a required check) instead of burning a cell to
  # say no.
  changes:
    name: classify paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify the changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          ALWAYS: ${{ inputs.always_run }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$ALWAYS" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "$EVENT" in
            push|schedule|workflow_dispatch) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # pull_request: path filter on the embedding surface. The head
          # sha of a cross-fork PR is not always in the checkout, so it is
          # fetched when needed. If that also fails, the cell runs: this
          # workflow has no required contexts, but skipping the embed jobs
          # on a real embed change would be the bad direction.
          head_sha=""
          for candidate in "$HEAD" "FETCH_HEAD"; do
            if [ -n "$candidate" ] && git cat-file -e "$candidate" 2>/dev/null; then
              head_sha="$candidate"
              break
            fi
          done
          if [ -z "$head_sha" ]; then
            git fetch --no-tags --depth=1 origin "$HEAD" 2>/dev/null || true
            if git cat-file -e "$HEAD" 2>/dev/null; then head_sha="$HEAD"; fi
          fi
          if [ -z "$head_sha" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$head_sha")"
          if grep -Eq '(^src/pyscriptc/(boxed|embed)\.py$|^src/pyscriptc/emit/llvm/_driver\.py$|^src/pyscriptc/runtime/ps_island\.c$|^packaging/(runtime\.lock\.toml|third-party\.toml)$|^scripts/(embed|gen_third_party_notices|check_runtime_bump)|^\.github/workflows/(embed|runtime-bump)\.yml$)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  acceptance:
    name: embed acceptance (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The classifier has already ruled that the diff touches the embed
      # surface. The only remaining per-cell decision is the macOS PR skip
      # (EMBED_PR_SKIP_MACOS), which stays a step-level gate because
      # `matrix` is not available in a job-level `if`.
      - name: Decide whether to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          ALWAYS: ${{ inputs.always_run }}
          PR_SKIP_MACOS: ${{ vars.EMBED_PR_SKIP_MACOS }}
        run: |
          set -euo pipefail
          if [ "$ALWAYS" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "$EVENT" in
            push|schedule) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ "$PR_SKIP_MACOS" = "true" ] && [ "${{ matrix.os }}" = "macos-14" ]; then
            echo "macOS PR cell disabled by EMBED_PR_SKIP_MACOS" >&2
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.run == 'true'
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"

      - run: uv sync --frozen
        if: steps.gate.outputs.run == 'true'

      # The pack is cached on the lock file hash: one download per lock
      # change, restored otherwise. The lock does not exist before #657
      # lands; the pre-step turns the whole job into a clean skip then.
      - name: Cache the runtime pack
        if: steps.gate.outputs.run == 'true'
        id: pack
        uses: actions/cache@v5
        with:
          path: ~/.cache/pyscriptc/runtime
          key: pyscriptc-runtime-${{ matrix.platform }}-${{ hashFiles('packaging/runtime.lock.toml') }}
          restore-keys: |
            pyscriptc-runtime-${{ matrix.platform }}-

      - name: Fetch the pinned pack
        if: steps.gate.outputs.run == 'true'
        id: fetch
        run: |
          set -euo pipefail
          if [ ! -f packaging/runtime.lock.toml ]; then
            echo "packaging/runtime.lock.toml is absent: the runtime pack slice (#657) has not landed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run pyscriptc embed fetch --platform ${{ matrix.platform }}
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # The acceptance matrix of issue #661: compile three programs into
      # bundles, relocate the bundles, hide the build tree and the pack
      # cache, run each under `env -i` (no PATH, no HOME, no PYTHONHOME)
      # and compare stdout, stderr and exit code with CPython's.
      - name: Compile, relocate and run the acceptance programs
        if: steps.gate.outputs.run == 'true' && steps.fetch.outputs.skip != 'true'
        env:
          WORK: ${{ runner.temp }}/embed-acceptance
        run: |
          set -euo pipefail
          mkdir -p "$WORK/fresh" "$WORK/home"

          # The three acceptance programs (fixtures, so no heredocs):
          # 1. the stdlib-only island fractions program,
          # 2. a program importing a pure-Python dependency (issue #660),
          # 3. a program reading a staged data file (issue #665).
          uv run pyscriptc compile --island tests/fixtures/embed/island_fractions.py --emit bin \
            --embed-python=bundle -o "$WORK/out/stdlib/prog"
          uv run pyscriptc compile --island tests/fixtures/embed/island_dependency.py --emit bin \
            --embed-python=bundle -o "$WORK/out/sitedep/depprog"
          uv run pyscriptc compile --program tests/fixtures/embed/datafile --island --fallback=cpython \
            --emit bin --embed-python=bundle -o "$WORK/out/datafile/prog"

          # CPython references first (stdout, stderr, exit code per program),
          # then relocate: the bundles move to a fresh directory, the build
          # outputs are deleted, the pack cache is moved away and the source
          # fixtures are renamed away, so nothing resolves back into them.
          python3 tests/fixtures/embed/island_fractions.py >"$WORK/ref-stdlib.out" 2>"$WORK/ref-stdlib.err"; echo $? >"$WORK/ref-stdlib.rc"
          uv run python3 tests/fixtures/embed/island_dependency.py >"$WORK/ref-sitedep.out" 2>"$WORK/ref-sitedep.err"; echo $? >"$WORK/ref-sitedep.rc"
          (cd tests/fixtures/embed/datafile && python3 __main__.py) >"$WORK/ref-datafile.out" 2>"$WORK/ref-datafile.err"; echo $? >"$WORK/ref-datafile.rc"

          mv "$WORK/out/stdlib/prog" "$WORK/fresh/stdlib"
          mv "$WORK/out/sitedep/depprog" "$WORK/fresh/sitedep"
          mv "$WORK/out/datafile/prog" "$WORK/fresh/datafile"
          rm -rf "$WORK/out"
          mv "$HOME/.cache/pyscriptc/runtime" "$HOME/.cache/pyscriptc/runtime-moved"
          for tree in island_fractions.py island_dependency.py datafile; do
            mv "tests/fixtures/embed/$tree" "tests/fixtures/embed/$tree-hidden"
          done

          status=0
          compare() {  # compare <label> <bundle binary> <reference name>
            label="$1"; bin="$2"; name="$3"
            set +e
            got_out="$(env -i HOME="$WORK/home" "$bin" 2>"$WORK/got.err")"; got_rc=$?
            got_err="$(cat "$WORK/got.err")"
            want_out="$(cat "$WORK/ref-$name.out")"
            want_err="$(cat "$WORK/ref-$name.err")"
            want_rc="$(cat "$WORK/ref-$name.rc")"
            set -e
            if [ "$got_out" != "$want_out" ] || [ "$got_err" != "$want_err" ] || [ "$got_rc" != "$want_rc" ]; then
              echo "::error::$label differs from CPython" >&2
              echo "  bundle: rc=$got_rc stdout=[$got_out] stderr=[$got_err]" >&2
              echo "  cpython: rc=$want_rc stdout=[$want_out] stderr=[$want_err]" >&2
              status=1
              return
            fi
            echo "$label: rc=$got_rc stdout=[$got_out] (matches CPython)"
          }

          compare "stdlib island fractions" "$WORK/fresh/stdlib/bin/prog" stdlib
          compare "bundled pure dependency" "$WORK/fresh/sitedep/bin/depprog" sitedep
          compare "program data file" "$WORK/fresh/datafile/bin/prog" datafile

          # Issue #709: the output carries the license texts.
          for f in LICENSE.cpython.txt LICENSE.expat.txt NOTICE; do
            [ -f "$WORK/fresh/stdlib/share/licenses/$f" ] \
              || { echo "::error::share/licenses/$f missing from the bundle" >&2; status=1; }
          done

          # Loader assertions: the relative rpath is present and no absolute
          # path into the build tree or the pack survives in the image.
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            otool -L "$WORK/fresh/stdlib/bin/prog" | tail -n +2 > "$WORK/otool.txt"
            otool -l "$WORK/fresh/stdlib/bin/prog" | tail -n +2 > "$WORK/otool-l.txt"
            grep -q '@executable_path/../lib' "$WORK/otool-l.txt" \
              || { echo "::error::no @executable_path/../lib rpath" >&2; status=1; }
            if grep -Eq "$WORK" "$WORK/otool.txt" "$WORK/otool-l.txt"; then
              echo "::error::an absolute build path survives in the binary" >&2; status=1
            fi
          else
            readelf -d "$WORK/fresh/stdlib/bin/prog" > "$WORK/readelf.txt"
            grep -q '$ORIGIN/../lib' "$WORK/readelf.txt" \
              || { echo "::error::no $ORIGIN/../lib rpath" >&2; cat "$WORK/readelf.txt" >&2; status=1; }
            if grep -Eq "$WORK" "$WORK/readelf.txt"; then
              echo "::error::an absolute build path survives in the binary" >&2; status=1
            fi
          fi

          # Size gates: macOS at most 40 MB, Linux at most 60 MB uncompressed,
          # measured on the largest of the three bundles.
          kb="$(du -sk "$WORK/fresh"/* | awk '{print $1}' | sort -n | tail -1)"
          limit_mb=$([ "${{ matrix.os }}" = "macos-14" ] && echo 40 || echo 60)
          echo "bundle size: $kb KB (limit ${limit_mb} MB)"
          [ "$kb" -le $((limit_mb * 1024)) ] || { echo "::error::the bundle exceeds its size gate" >&2; status=1; }

          # Put the world back before reporting, so the step is re-runnable.
          for tree in island_fractions.py island_dependency.py datafile; do
            mv "tests/fixtures/embed/$tree-hidden" "tests/fixtures/embed/$tree"
          done
          mv "$HOME/.cache/pyscriptc/runtime-moved" "$HOME/.cache/pyscriptc/runtime"
          exit "$status"

      - name: Summary
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "embed acceptance (${{ matrix.os }}): skipped=${{ steps.fetch.outputs.skip }}" >> "$GITHUB_STEP_SUMMARY"
