# Native release binaries (Nuitka onefile). One OS and arch per runner. No cross compile.
#
# macOS x86_64 uses macos-15-intel, a native Intel runner. macos-13 is retired.
# Do not build that target on macos-14 with a cross arch flag.
# Linux stays on ubuntu-24.04 (glibc 2.39). Do not switch runners for an older glibc.
# Windows x86_64 is experimental. The build step must pass. Only the Windows
# smoke step sets continue-on-error. There is no Windows arm64 target.
# The Windows smoke stays explain-only: link_binary compiles every
# src/pyscriptc/runtime/*.c into every emitted program, and ps_mix.c needs
# dlfcn.h/dlopen, which MinGW-w64 does not provide. compile+run needs a
# src/pyscriptc change, so it is out of scope here.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to dry run against, e.g. v0.1.0 (builds and verifies the dists, never publishes)"
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }}${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
            artifact: pyscriptc-macos-arm64
            platform: unix
          - runner: macos-15-intel
            target: macos-x86_64
            artifact: pyscriptc-macos-x86_64
            platform: unix
          - runner: ubuntu-24.04
            target: linux-x86_64
            artifact: pyscriptc-linux-x86_64
            platform: unix
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            artifact: pyscriptc-linux-aarch64
            platform: unix
          - runner: windows-2022
            target: windows-x86_64
            artifact: pyscriptc-windows-x86_64.exe
            platform: windows
            experimental: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install patchelf and clang
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf clang

      # Bake the PostHog project token into the package (src/pyscriptc/_posthog_token.py,
      # gitignored). Without it the binary still builds; telemetry is a no-op.
      - name: Stamp PostHog token
        env:
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: printf 'TOKEN = "%s"\n' "$POSTHOG_PROJECT_TOKEN" > src/pyscriptc/_posthog_token.py

      - name: Build
        shell: bash
        run: |
          uv sync --group packaging
          packaging/build.sh

      - name: Smoke (full)
        if: matrix.platform == 'unix'
        shell: bash
        run: packaging/smoke.sh "packaging/dist/${{ matrix.artifact }}"

      # Explain-only on purpose. Emitted programs cannot compile on Windows:
      # the runtime links ps_mix.c into every binary and MinGW-w64 has no
      # dlfcn.h. See the header comment and packaging/TOOLCHAIN.md.
      - name: Smoke (Windows explain)
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: bash
        run: packaging/smoke.sh "packaging/dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: packaging/dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: checksums and draft release
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            CHANGELOG.md
            .github
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/release_notes.py "$TAG" CHANGELOG.md .github/release-footer.md > release-notes.md

      - name: sha256sums.txt
        run: |
          set -euo pipefail
          mkdir -p bundle
          find dist -type f -name 'pyscriptc-*' -exec cp -t bundle {} +
          mapfile -t bins < <(find bundle -maxdepth 1 -type f -name 'pyscriptc-*' | sort)
          if [ "${#bins[@]}" -ne 5 ]; then
            echo "expected 5 release binaries, found ${#bins[@]}" >&2
            find dist -type f -print >&2
            exit 1
          fi
          (
            cd bundle
            sha256sum pyscriptc-* | LC_ALL=C sort -k2 > sha256sums.txt
            cat sha256sums.txt
          )

      - uses: actions/upload-artifact@v6
        with:
          name: release-bundle
          path: bundle/
          if-no-files-found: error

      - name: Draft GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ${{ github.ref_name }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: bundle/*

  # PyPI publish, two stages: verify (no secrets) -> publish (approval
  # gate). The pypi-publish GitHub environment holds the required-reviewer
  # approval; the PyPI trusted publisher is configured for workflow
  # release.yml + environment pypi-publish. workflow_dispatch takes a tag
  # input and is verify-only: publish stays gated on push events.
  verify:
    name: verify dists
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      # Same token stamp as the binary build; see src/pyscriptc/telemetry.py.
      - name: Stamp PostHog token
        env:
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: printf 'TOKEN = "%s"\n' "$POSTHOG_PROJECT_TOKEN" > src/pyscriptc/_posthog_token.py

      - name: Build sdist and wheel
        run: uv build

      # Emitted programs link every src/pyscriptc/runtime/*.c from the
      # installed package; a wheel that misses them produces broken output.
      - name: Check the wheel ships the C runtime
        run: |
          set -euo pipefail
          n="$(unzip -Z1 dist/pyscriptc-*-any.whl | grep -cE '^pyscriptc/runtime/.+\.c$')"
          echo "runtime .c files in wheel: $n"
          [ "$n" -ge 15 ]

      - name: Wheel-install smoke test
        run: |
          set -euo pipefail
          command -v clang >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq clang; }
          uv venv /tmp/pv
          uv pip install --python /tmp/pv/bin/python dist/pyscriptc-*-any.whl
          printf 'def main() -> int:\n    x: int = 40 + 2\n    print("hello", x)\n    return 0\n' > /tmp/hello.py
          out="$(/tmp/pv/bin/pyscriptc compile /tmp/hello.py --emit bin --run -o /tmp/hello-bin)"
          echo "$out"
          echo "$out" | grep -qx 'hello 42'
          [ "$(echo "$out" | tail -1)" = "0" ]

      - name: Verify tag matches pyproject version
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          V="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "$V" = "$VER" ] || { echo "version mismatch: pyproject $V, tag $TAG"; exit 1; }

      - uses: actions/upload-artifact@v6
        with:
          name: pypi-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Tag pushes queue here until a required reviewer approves the
    # pypi-publish environment (repo Settings > Environments).
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pypi-dists
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
