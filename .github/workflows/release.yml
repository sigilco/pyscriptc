# Native release binaries (Nuitka onefile). One matrix cell per OS/arch; no cross-compile.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
            artifact: pyscriptc-macos-arm64
            platform: unix
          - runner: macos-15-intel
            target: macos-x86_64
            artifact: pyscriptc-macos-x86_64
            platform: unix
          - runner: ubuntu-24.04
            target: linux-x86_64
            artifact: pyscriptc-linux-x86_64
            platform: unix
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            artifact: pyscriptc-linux-aarch64
            platform: unix
          - runner: windows-2022
            target: windows-x86_64
            artifact: pyscriptc-windows-x86_64.exe
            platform: windows
            experimental: true
    env:
      NUITKA_LOW_MEMORY: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install patchelf (Linux)
        if: matrix.platform == 'unix' && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf

      - name: Install clang (Unix smoke)
        if: matrix.platform == 'unix'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get install -y -qq clang
          fi

      - name: Build
        shell: bash
        run: |
          uv sync --group packaging
          packaging/build.sh

      - name: Smoke (full)
        if: matrix.platform == 'unix'
        shell: bash
        run: packaging/smoke.sh "packaging/dist/${{ matrix.artifact }}"

      - name: Smoke (Windows explain)
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: bash
        run: packaging/smoke.sh "packaging/dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: packaging/dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: checksums and draft release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: sha256sums.txt
        run: |
          cd dist
          sha256sum pyscriptc-* > sha256sums.txt
          cat sha256sums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            dist/pyscriptc-*
            dist/sha256sums.txt

      - name: Draft GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          body: |
            ## Binaries

            | Target | Artifact | Runner |
            | --- | --- | --- |
            | macos-arm64 | `pyscriptc-macos-arm64` | macos-14 |
            | macos-x86_64 | `pyscriptc-macos-x86_64` | macos-15-intel |
            | linux-x86_64 | `pyscriptc-linux-x86_64` | ubuntu-24.04 |
            | linux-aarch64 | `pyscriptc-linux-aarch64` | ubuntu-24.04-arm |
            | windows-x86_64 (experimental) | `pyscriptc-windows-x86_64.exe` | windows-2022 |

            Verify downloads with `sha256sums.txt` in this release.

            ### Toolchain

            Each binary is the compiler only. User programs still need `clang` on `PATH` (see `packaging/TOOLCHAIN.md`).

            - **Linux x86_64 / aarch64** builds use **glibc 2.39** (Ubuntu 24.04 runners). Older distros may need a newer glibc or a local build.
            - **Windows** builds are **experimental**. There is no Windows arm64 release. Programs the compiler emits are **POSIX-oriented** (same contract as macOS/Linux); they are not native Windows PE user programs beyond the compiler binary itself.
            - Nuitka does not cross-compile: each row is built on its own OS and CPU.
          files: |
            dist/pyscriptc-*
            dist/sha256sums.txt
