# Native release binaries (Nuitka onefile). One OS and arch per runner. No cross compile.
#
# macOS x86_64 uses macos-15-intel, a native Intel runner. macos-13 is retired.
# Do not build that target on macos-14 with a cross arch flag.
# Linux stays on ubuntu-24.04 (glibc 2.39). Do not switch runners for an older glibc.
# Windows x86_64 is experimental. The build step must pass. Only the Windows
# smoke step sets continue-on-error. There is no Windows arm64 target.
# The Windows smoke stays explain-only: link_binary compiles every
# src/pyscriptc/runtime/*.c into every emitted program, and ps_mix.c needs
# dlfcn.h/dlopen, which MinGW-w64 does not provide. compile+run needs a
# src/pyscriptc change, so it is out of scope here.
#
# workflow_dispatch is the rehearsal: it builds, smoke-tests and wheel-verifies the exact
# commit given by `ref` (a branch or a full SHA; empty means the dispatched commit), with the
# version taken from pyproject.toml. It never creates a GitHub Release and never publishes.
# Dispatch runs are named "rehearsal <ref>". The publish job and cut-release.yml look for a
# successful run with the title "rehearsal <full SHA>", so pass the full SHA (or dispatch from
# the branch and leave `ref` empty) when the rehearsal must count as a release gate.
#
# Tag spellings: tags are SemVer-style (v0.6.0, v0.6.0-beta.1, v0.6.0-rc.2) while
# pyproject.toml carries the PEP 440 form (0.6.0, 0.6.0b1, 0.6.0rc2). On a tag push the
# verify job maps the tag with release_bar.py and refuses a mismatch. b and rc tags get a
# prerelease (never Latest) GitHub Release, still draft; the owner publishes it by hand.
name: release

run-name: ${{ github.event_name == 'workflow_dispatch' && format('rehearsal {0}', inputs.ref || github.sha) || format('release {0}', github.ref_name) }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or full SHA to rehearse (empty: the dispatched commit). Builds and verifies only; never releases or publishes"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  build:
    name: build (${{ matrix.target }}${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
            artifact: pyscriptc-macos-arm64
            platform: unix
          - runner: macos-15-intel
            target: macos-x86_64
            artifact: pyscriptc-macos-x86_64
            platform: unix
          - runner: ubuntu-24.04
            target: linux-x86_64
            artifact: pyscriptc-linux-x86_64
            platform: unix
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            artifact: pyscriptc-linux-aarch64
            platform: unix
          - runner: windows-2022
            target: windows-x86_64
            artifact: pyscriptc-windows-x86_64.exe
            platform: windows
            experimental: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"

      # ccache is content addressed (preprocessed source plus flags), so a restored
      # cache can only miss, never return a stale object. Nuitka picks ccache up from PATH.
      - name: ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: nuitka-${{ matrix.target }}-${{ hashFiles('uv.lock', 'packaging/build.sh') }}
          restore-keys: nuitka-${{ matrix.target }}-
          max-size: 1G

      # Nuitka downloads (MinGW64, depends.exe) on Windows; versioned by Nuitka itself.
      - name: Nuitka download cache
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-dl-${{ matrix.target }}-${{ hashFiles('uv.lock') }}
          restore-keys: nuitka-dl-${{ matrix.target }}-

      - name: Install patchelf and clang
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf clang

      # Bake the PostHog project token into the package (src/pyscriptc/_posthog_token.py,
      # gitignored). Without it the binary still builds; telemetry is a no-op.
      - name: Stamp PostHog token
        env:
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: printf 'TOKEN = "%s"\n' "$POSTHOG_PROJECT_TOKEN" > src/pyscriptc/_posthog_token.py

      - name: Build
        shell: bash
        run: |
          uv sync --group packaging
          packaging/build.sh

      - name: Smoke (full)
        if: matrix.platform == 'unix'
        shell: bash
        run: packaging/smoke.sh "packaging/dist/${{ matrix.artifact }}"

      # Explain-only on purpose. Emitted programs cannot compile on Windows:
      # the runtime links ps_mix.c into every binary and MinGW-w64 has no
      # dlfcn.h. See the header comment and packaging/TOOLCHAIN.md.
      - name: Smoke (Windows explain)
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: bash
        run: packaging/smoke.sh "packaging/dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: packaging/dist/${{ matrix.artifact }}
          if-no-files-found: error

  # The pinned CPython runtime packs for --embed-python=bundle (issue #657).
  # One job per locked platform, from packaging/runtime.lock.toml. The pack
  # attaches to the GitHub release (draft, same as the binaries); a rehearsal
  # builds and uploads the artifact without attaching anything.
  runtime-pack:
    name: runtime pack (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    needs: [build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
          - platform: linux-x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build the runtime pack
        run: python3 scripts/build_runtime_pack.py --platform ${{ matrix.platform }} -o dist/

      - name: Pack size gate (60 MB, plan kill criterion)
        run: |
          set -euo pipefail
          pack="dist/pyscriptc-runtime-"*.tar.zst
          for f in $pack; do
            bytes="$(stat -c %s "$f" 2>/dev/null || stat -f %z "$f")"
            echo "$f: $bytes bytes"
            [ "$bytes" -le $((60 * 1024 * 1024)) ] || { echo "$f exceeds 60 MB" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@v6
        with:
          name: runtime-pack-${{ matrix.platform }}
          path: dist/pyscriptc-runtime-*.tar.zst
          if-no-files-found: error

  release:
    name: checksums and draft release
    needs: [build, verify, runtime-pack]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.verify.result == 'success' }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            CHANGELOG.md
            .github
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/release_notes.py "$TAG" CHANGELOG.md .github/release-footer.md "$GITHUB_REPOSITORY" > release-notes.md

      - name: sha256sums.txt
        run: |
          set -euo pipefail
          mkdir -p bundle
          # The runtime packs ride in the same bundle but are not "binaries":
          # the count below pins the 5 compiler binaries only.
          find dist -type f -name 'pyscriptc-runtime-*' -exec cp -t bundle {} +
          find dist -type f -name 'pyscriptc-*' ! -name '*.whl' ! -name '*.tar.gz' ! -name 'pyscriptc-runtime-*' -exec cp -t bundle {} +
          mapfile -t bins < <(find bundle -maxdepth 1 -type f -name 'pyscriptc-*' ! -name 'pyscriptc-runtime-*' | sort)
          if [ "${#bins[@]}" -ne 5 ]; then
            echo "expected 5 release binaries, found ${#bins[@]}" >&2
            find dist -type f -print >&2
            exit 1
          fi
          (
            cd bundle
            sha256sum pyscriptc-* pyscriptc-runtime-* | LC_ALL=C sort -k2 > sha256sums.txt
            cat sha256sums.txt
          )

      - uses: actions/upload-artifact@v6
        with:
          name: release-bundle
          path: bundle/
          if-no-files-found: error

      - name: Draft GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          # Prerelease for b and rc tags so it can never become the Latest release; the owner
          # flips the flag by hand when promoting the stable build.
          prerelease: ${{ needs.verify.outputs.is_prerelease == 'true' }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: bundle/*

  # PyPI publish, two stages: verify (no secrets) -> publish (approval
  # gate). The pypi-publish GitHub environment holds the required-reviewer
  # approval; the PyPI trusted publisher is configured for workflow
  # release.yml + environment pypi-publish. workflow_dispatch takes a ref
  # input and is a rehearsal: verify-only, publish stays gated on push events
  # and on a prior successful rehearsal of the release commit.
  verify:
    name: verify dists
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      is_prerelease: ${{ steps.tagver.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"

      # Same token stamp as the binary build; see src/pyscriptc/telemetry.py.
      - name: Stamp PostHog token
        env:
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
        run: printf 'TOKEN = "%s"\n' "$POSTHOG_PROJECT_TOKEN" > src/pyscriptc/_posthog_token.py

      - name: Build sdist and wheel
        run: uv build

      # Emitted programs link every src/pyscriptc/runtime/*.c from the
      # installed package; a wheel that misses them produces broken output.
      - name: Check the wheel ships the C runtime
        run: |
          set -euo pipefail
          n="$(unzip -Z1 dist/pyscriptc-*-any.whl | grep -cE '^pyscriptc/runtime/.+\.c$')"
          echo "runtime .c files in wheel: $n"
          [ "$n" -ge 15 ]

      - name: Wheel-install smoke test
        run: |
          set -euo pipefail
          command -v clang >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq clang; }
          uv venv /tmp/pv
          uv pip install --python /tmp/pv/bin/python dist/pyscriptc-*-any.whl
          printf 'def main() -> int:\n    x: int = 40 + 2\n    print("hello", x)\n    return 0\n' > /tmp/hello.py
          out="$(/tmp/pv/bin/pyscriptc compile /tmp/hello.py --emit bin --run -o /tmp/hello-bin)"
          echo "$out"
          echo "$out" | grep -qx 'hello 42'
          [ "$(echo "$out" | tail -1)" = "0" ]

      - name: Rehearsal report
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          V="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          {
            echo "### Rehearsal passed for $sha"
            echo
            echo "Version from pyproject.toml: $V. Nothing was released or published."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REF" ] && [ "$REF" != "$sha" ]; then
            echo "::warning::ref '$REF' is not a full SHA. This run is titled 'rehearsal $REF' and will not satisfy the cut-release or publish gates. Re-dispatch with ref=$sha."
          fi

      - name: Verify tag matches pyproject version
        id: tagver
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          V="$(python3 .github/scripts/release_bar.py tag "$TAG")"
          P="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "$P" = "$V" ] || { echo "version mismatch: tag $TAG maps to PEP 440 $V, pyproject says $P"; exit 1; }
          echo "tag-version=$V" >> "$GITHUB_OUTPUT"
          echo "is-prerelease=$([[ "$V" =~ (b|rc)[0-9]+$ ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: pypi-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Tag pushes queue here until a required reviewer approves the
    # pypi-publish environment (repo Settings > Environments).
    environment: pypi-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # First step on purpose: fail before anything is published unless a
      # successful workflow_dispatch rehearsal covers the release commit (its
      # parent, when the release commit only changes pyproject.toml, uv.lock
      # and CHANGELOG.md). No bypass here: rehearse, then re-run this job.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Require a rehearsal of the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_bar.py check-rehearsal --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"

      - uses: actions/download-artifact@v7
        with:
          name: pypi-dists
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
