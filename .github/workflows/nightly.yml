# Nightly (T2 tier): visible-corpus score trend and boxed ledger window.
#
# Never blocks master. A failing score or ledger step opens (or comments on)
# a single open issue labelled `nightly-failure`; it does not gate merges.
# The scorer holdout is never touched here: this workflow reads only the
# visible corpus and the probes in the tree.
#
# Results are uploaded as a run artifact (retention 90 days). The job summary
# carries the weighted pass so the trend is readable without downloading.
#
# The score and ledger steps run the raw commands, not `mise run <task>`, for
# the same reason as ci.yml: the mise uv pin (`latest`) would drop the
# `>= 0.13.4` uv floor this workflow holds. The commands are the ones the
# `compat:json`, `compat:ladder`, `compat:r0` and `boxed:cost` tasks wrap.

name: nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  visible-score:
    name: visible corpus score
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # contents: write and pull-requests: write are for the compat snapshot
    # bot PR only. The PR carries data/compat/compat.json and nothing else.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      failed: ${{ steps.result.outputs.failed }}
      snapshot_sha: ${{ steps.pr.outputs.snapshot_sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"

      - name: Install clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang

      - run: uv python install 3.14.9

      - name: Sync dependencies
        run: uv sync --frozen

      # Entries are keyed inside cache.py on probe, oracle version and compiler file
      # hashes, so a restored entry can only hit when its inputs are identical. The outer
      # key also pins the clang version and the lockfile; restore-keys stay within
      # one toolchain.
      - name: Toolchain fingerprint
        id: tc
        run: |
          echo "v=$(clang --version | head -1 | tr -c 'A-Za-z0-9.\n' '_')" >> "$GITHUB_OUTPUT"
          # Hash once, before the scorer writes into the workspace. The expression form
          # hashFiles() is re-evaluated by the cache post step and failed there with
          # "Fail to hash files under directory" (runs 42464157597, 42475006519).
          echo "h=$(git ls-files -z uv.lock src/pyscriptc benchmarks/compat2 | grep -zv '^benchmarks/compat2/\.cache/' | xargs -0 sha256sum | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - name: Restore scorer cache
        uses: actions/cache@v5
        with:
          path: benchmarks/compat2/.cache
          key: compat2-${{ runner.os }}-${{ steps.tc.outputs.v }}-${{ steps.tc.outputs.h }}
          restore-keys: compat2-${{ runner.os }}-${{ steps.tc.outputs.v }}-

      - name: oracle is CPython 3.14.9
        run: uv run python -c "import sys; assert sys.version_info[:3] == (3, 14, 9), sys.version"

      - name: Visible-corpus score
        id: score
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p nightly
          uv run python -m benchmarks.compat2.score benchmarks/compat2/probes --corpus \
            --out nightly/visible-score.json 2>&1 | tee nightly/visible-score.log

      # Rebuild the compat site data file from the tree plus the score that
      # just ran. When it changed, open (or update) one bot PR that carries
      # only that file: master is PR-only, so the nightly never pushes to it.
      # The PR merges, the site workflow rebuilds and deploys. When the
      # ruleset blocks auto-merge, the PR stays open for the owner and the
      # raw JSON ships as an artifact. Design: .agents/docs/compat-site.md.
      - name: Compat site data
        id: compat
        if: steps.score.outcome == 'success'
        run: |
          set -euo pipefail
          uv run python -m benchmarks.scripts_corpus.ladder --json data/compat/ladder.json
          # The R0 rung (the vendored real scripts) rides in the same ladder
          # document, with its 30-value trend. Design: benchmarks/real_scripts/.
          mkdir -p nightly
          uv run python -m benchmarks.real_scripts.measure --quiet --json nightly/r0.json
          uv run python scripts/r0_lane.py --json data/compat/ladder.json --measure nightly/r0.json
          # The island receipts first, so the compat file carries fresh
          # verdicts. A probe failure keeps the old receipts: the file then
          # says what was last measured, never an invented verdict.
          uv run python -m benchmarks.compat.top100.island_probe --json data/compat/island.json || \
            echo "island probe failed; keeping the previous receipts"
          uv run python scripts/build_compat_json.py \
            --out data/compat/compat.json \
            --score nightly/visible-score.json \
            --ladder data/compat/ladder.json
          if git diff --quiet -- data/compat/compat.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "compat data unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # The artifact carries the raw JSON too, so the owner can refresh the
          # data by hand when the bot PR cannot be opened.
          mkdir -p nightly
          cp data/compat/compat.json nightly/compat.json
          cp data/compat/ladder.json nightly/ladder.json
          cp data/compat/island.json nightly/island.json

      # The bot PR carries only data/compat/*.json, so the pull_request runs
      # of ci.yml, embed.yml and site.yml on it are excluded (see the
      # branches-ignore in those workflows). Those runs were held at
      # action_required until an owner approved them, because the PR author
      # github-actions[bot] trips the bot-PR approval gate, and the nightly
      # then sat waiting for an approval nobody was watching for. The
      # nightly therefore validates what the PR carries, on the tree that
      # is about to be pushed, before opening it: schema, contract tests
      # and the same data seams the `docs seams` lane runs in ci.yml. The
      # artifact still carries the raw JSON for a manual recovery.
      - name: The compat data the PR will carry validates
        if: steps.compat.outputs.changed == 'true'
        run: |
          set -euo pipefail
          uv run python -c "
          import json, sys
          sys.path.insert(0, '.')
          from scripts.compat_schema import validate
          problems = validate(json.load(open('data/compat/compat.json')))
          if problems:
              print('\n'.join(problems), file=sys.stderr)
              sys.exit(1)
          print('compat.json validates')
          "
          uv run pytest -q \
            tests/test_compat_json.py \
            tests/test_compat_site.py \
            tests/test_doc_cadence.py \
            tests/test_support_docs.py \
            -m "not linux_container"
      - name: Open the compat snapshot PR
        id: pr
        if: steps.compat.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          branch="bot/compat-snapshot"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/compat/compat.json data/compat/ladder.json data/compat/island.json
          git commit -m "ci: nightly compat snapshot ${DATE}"
          git push --force origin "HEAD:${branch}"
          body="$(mktemp)"
          printf 'Nightly compat snapshot for %s.\n\nThis PR carries only `data/compat/compat.json`, rebuilt from the tree by `scripts/build_compat_json.py`.\nThe nightly already validated it through the site build and the compat seams before opening this PR. The commit is the bot identity, so the owner merges it without review; a bad change is reverted with one revert commit.\n' "${DATE}" > "$body"
          number="$(gh pr list --repo "$REPO" --head "$branch" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPO" --body-file "$body" >/dev/null
          else
            number="$(gh pr create --repo "$REPO" --head "$branch" --base master \
              --title "ci: nightly compat snapshot ${DATE}" --body-file "$body" \
              | sed -E 's|.*/pull/([0-9]+)$|\1|')"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "url=$(gh pr view "$number" --repo "$REPO" --json url --jq '.url')" >> "$GITHUB_OUTPUT"
          # The sha of the snapshot commit, so the site build can check it
          # out and assemble exactly the data this PR carries.
          echo "snapshot_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Auto-merge cannot work and is not wanted here. The compat snapshot
      # PR is authored by github-actions[bot], and a pull_request workflow
      # run from that bot waits at action_required until an owner approves
      # it (runs 40189670771, 40328475181). The repo also has
      # `allow_auto_merge` off, so `--auto` cannot queue a merge. And a bot
      # PR with `can_approve_pull_request_reviews=true` cannot be approved
      # by its own GITHUB_TOKEN, so the earlier auto-approve attempts
      # always failed. This step therefore does nothing but print that the
      # PR waits for the owner, which is now the designed flow: the nightly
      # validated the data itself before opening the PR, and the owner
      # merges it. Kept, rather than deleted, so the run log still says so.
      - name: The snapshot PR waits for the owner
        if: steps.pr.outputs.number != ''
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          echo "compat snapshot PR $NUMBER opened; the nightly validated the data above" >&2
          echo "and the repo disables auto-merge for bot PRs, so the owner merges it by hand." >&2
      - name: Record outcome
        id: result
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.score.outcome }}" = "success" ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "### Visible score" >> "$GITHUB_STEP_SUMMARY"
            grep -E '^(scored|weighted pass)' nightly/visible-score.log >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "Visible score failed. See nightly/visible-score.log in the artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p nightly
          printf '{"date":"%s","commit":"%s","score_outcome":"%s","snapshot_pr":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" "${{ steps.score.outcome }}" "${{ steps.pr.outputs.url }}" > nightly/run.json

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-visible-${{ github.run_id }}
          path: nightly/
          retention-days: 90
          if-no-files-found: warn

  # The site build over the data the snapshot PR carries. The site workflow
  # has a workflow_call trigger precisely so the nightly can validate the
  # compat data through the real site build: the page assembles
  # data/compat/compat.json, so a broken data file fails here, on the
  # nightly, instead of in a pull_request run held at action_required.
  #
  # The `ref` input makes the checkout the snapshot commit, so the site
  # assembles exactly the bytes the PR carries. The site job never deploys;
  # the Cloudflare dashboard git integration does that on master pushes.
  site-check:
    name: build the site over the compat snapshot
    needs: visible-score
    # Only when the nightly actually opened a snapshot PR, so there is a
    # snapshot commit to build the site over.
    if: needs.visible-score.outputs.snapshot_sha != ''
    uses: ./.github/workflows/site.yml
    with:
      # The snapshot commit, so the site assembles exactly the compat data
      # the PR carries.
      ref: ${{ needs.visible-score.outputs.snapshot_sha }}
    permissions:
      contents: read

  boxed-ledger:
    name: boxed ledger window
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.result.outputs.failed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Boxed ledger
        id: ledger
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p nightly
          uv run python benchmarks/compat2/boxed_cost.py --window-commits 10 --json \
            | tee nightly/boxed-ledger.json

      - name: Record outcome
        id: result
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.ledger.outcome }}" = "success" ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-ledger-${{ github.run_id }}
          path: nightly/
          retention-days: 90
          if-no-files-found: warn

  # The R0 lane (issue #506): the real-script corpus, measured nightly.
  # The measurement is the same one `benchmarks/real_scripts/measure.py`
  # runs, and the published point (pass rate, corpus size, blocker ranking,
  # root-cause ranking) rides in `data/compat/ladder.json` under the `r0`
  # key, which the visible-score job writes into the compat snapshot.
  #
  # This job is the report-only half: it measures the same corpus, prints
  # the rate and the rankings into the job summary, and fails when the
  # measurement itself fails or when the rate drops below the value the
  # committed ladder document carries. A failure opens the same
  # `nightly-failure` issue the other lanes open. It never blocks master.
  r0-lane:
    name: R0 real-scripts lane
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.result.outputs.failed }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Measure the R0 corpus
        id: measure
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p nightly
          uv run python -m benchmarks.real_scripts.measure --quiet --json nightly/r0.json \
            | tee nightly/r0.log

      # A drop is a rate below the committed one. The comparison reads the
      # committed ladder document, so it is the last published value the
      # site showed, not the value of the previous nightly run.
      - name: Compare against the published rate
        id: drop
        if: steps.measure.outcome == 'success'
        run: |
          set -euo pipefail
          uv run python - <<'PY' > "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          measured = json.loads(Path("nightly/r0.json").read_text(encoding="utf-8"))
          scripts = measured.get("scripts", [])
          total = len(scripts)
          passed = sum(1 for script in scripts if script.get("compilePass"))
          rate = round(passed / total, 4) if total else 0.0

          published = {}
          path = Path("data/compat/ladder.json")
          if path.exists():
              document = json.loads(path.read_text(encoding="utf-8"))
              r0 = document.get("r0")
              if isinstance(r0, dict):
                  published = r0
          previous = published.get("rate")
          print(f"rate={rate}")
          print(f"passed={passed}")
          print(f"total={total}")
          if previous is None:
              print("dropped=false")
          else:
              print(f"dropped={'true' if rate < previous else 'false'}")
          print(f"previous={previous}")
          PY

      - name: Record outcome
        id: result
        if: always()
        env:
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
          DROPPED: ${{ steps.drop.outputs.dropped }}
          RATE: ${{ steps.drop.outputs.rate }}
          PASSED: ${{ steps.drop.outputs.passed }}
          TOTAL: ${{ steps.drop.outputs.total }}
          PREVIOUS: ${{ steps.drop.outputs.previous }}
        run: |
          set -euo pipefail
          if [ "$MEASURE_OUTCOME" != "success" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "### R0 lane: the measurement failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DROPPED" = "true" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "### R0 lane: the rate dropped" >> "$GITHUB_STEP_SUMMARY"
            printf 'R0 rate %s (%s of %s), previously %s.\n' \
              "$RATE" "$PASSED" "$TOTAL" "$PREVIOUS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "### R0 lane: the rate held" >> "$GITHUB_STEP_SUMMARY"
            printf 'R0 rate %s (%s of %s), previously %s.\n' \
              "$RATE" "$PASSED" "$TOTAL" "${PREVIOUS:-none}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-r0-${{ github.run_id }}
          path: nightly/
          retention-days: 90
          if-no-files-found: warn

  # Runtime A/B (epic #817, D2). The emit-flip harness from #943, as a
  # report-only nightly lane: per-program stdout/stderr/exit verdicts in
  # the job summary. No threshold; a FAIL row does not open nightly-failure.
  runtime-ab:
    name: runtime A/B (direct vs MIR)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"
          enable-cache: true
          python-version: "3.14"

      - name: Install clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang

      - run: uv python install 3.14.9

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Runtime A/B harness
        id: ab
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p nightly
          uv run python scripts/runtime_ab.py \
            --json-out nightly/runtime-ab.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            | tee nightly/runtime-ab.txt

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-runtime-ab-${{ github.run_id }}
          path: nightly/
          retention-days: 90
          if-no-files-found: warn


  # Strict corpus A/B (#527). The report-only sibling of the scorer's
  # whitespace-stripped comparison: every runnable probe of the visible
  # corpus runs natively and under the pinned CPython 3.14 oracle, and
  # stdout is compared as untrimmed bytes. A DIFF row is a candidate
  # divergence for the ledger; the job never blocks and never opens
  # nightly-failure.
  strict-corpus-ab:
    name: strict corpus A/B (unstripped bytes)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"
          enable-cache: true
          python-version: "3.14"

      - name: Install clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang

      - run: uv python install 3.14.9

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Strict corpus A/B harness
        id: strict
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p nightly
          uv run python scripts/strict_corpus_ab.py \
            --json-out nightly/strict-corpus-ab.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            | tee nightly/strict-corpus-ab.txt

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-strict-corpus-ab-${{ github.run_id }}
          path: nightly/
          retention-days: 90
          if-no-files-found: warn


  # The MIR lane nightly (cloud batch FR-1). PYSC_MIR=1 forces the MIR
  # emission path (`mir_opt_in` in src/pyscriptc/miremit.py; contract:
  # .agents/docs/mir-escape-hatch.md) for the whole default test
  # selection, the same set the ci.yml `macos-safe` shards run:
  # `tests --ignore=tests/compat2 -m "not linux_container"`. It runs the
  # selection unsharded because a nightly lane is not a merge gate and
  # one job is cheaper to read than three shards.
  #
  # It reports only: the pytest step is continue-on-error, the job feeds
  # no `report-failure` need, and the outcome lands in the job summary.
  # A red run means the MIR lane diverged somewhere in the suite; it is
  # signal for the strangler lane, never a merge blocker. The lane
  # changes no default: MIR stays opt-in and `MIR_DEFAULT` is untouched.
  mir-lane:
    name: MIR lane (PYSC_MIR=1, report only)
    # Same runner and toolchain pins as the ci.yml macos-safe shards, so
    # the selection runs where it is defined to pass.
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen

      - name: Default test selection under PYSC_MIR=1
        id: tests
        continue-on-error: true
        env:
          PYSC_MIR: "1"
        run: |
          set -o pipefail
          mkdir -p nightly
          uv run pytest -q tests --ignore=tests/compat2 -m "not linux_container" -n auto \
            2>&1 | tee nightly/mir-lane.log

      - name: Record outcome
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "### MIR lane (PYSC_MIR=1): passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### MIR lane (PYSC_MIR=1): FAILED (report only, does not gate)" >> "$GITHUB_STEP_SUMMARY"
          fi
          # The pytest summary line carries the pass/fail counts; the full
          # log ships as the nightly/mir-lane artifact below.
          grep -E '[0-9]+ (passed|failed|error|skipped|deselected)' nightly/mir-lane.log \
            | tail -5 >> "$GITHUB_STEP_SUMMARY" || true
          echo "Full log: the \`nightly-mir-${{ github.run_id }}\` artifact, file nightly/mir-lane.log." \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-mir-${{ github.run_id }}
          path: nightly/
          retention-days: 90
          if-no-files-found: warn

  # The embed acceptance (issue #885). It runs in its own workflow
  # (embed.yml, on its own schedule at 06:43, after this nightly's 06:17),
  # so nothing on the nightly page said when it went red. This lane reads
  # the most recent embed run's conclusion and puts it in the nightly
  # summary, so a red embed acceptance is visible next to the other nightly
  # lanes. The embed workflow's own report job opens the issue the moment
  # the acceptance fails; this lane is the standing "still red?" check.
  embed-acceptance:
    name: embed acceptance result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      failed: ${{ steps.result.outputs.failed }}
    steps:
      - name: Read the latest embed run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The latest run of the embed workflow on master (the schedule
          # push runs it unconditionally).
          conclusion="$(gh api "repos/$REPO/actions/workflows/embed.yml/runs?branch=master&per_page=1" \
            --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.html_url)"')"
          echo "latest=$conclusion" >> "$GITHUB_OUTPUT"
          echo "latest embed run: $conclusion"

      - name: Record outcome
        id: result
        if: always()
        run: |
          set -euo pipefail
          latest="${{ steps.run.outputs.latest }}"
          echo "### Embed acceptance (latest run): $latest" >> "$GITHUB_STEP_SUMMARY"
          case "$latest" in
            *" success "*) echo "failed=false" >> "$GITHUB_OUTPUT" ;;
            *" failure "*|*" cancelled "*) echo "failed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "failed=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # Failure reporting. One open issue per label; repeat failures add a comment.
  report-failure:
    name: open or update nightly-failure issue
    needs: [visible-score, boxed-ledger, embed-acceptance, r0-lane]
    if: ${{ always() && (needs.visible-score.outputs.failed == 'true' || needs.boxed-ledger.outputs.failed == 'true' || needs.embed-acceptance.outputs.failed == 'true' || needs.r0-lane.outputs.failed == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create nightly-failure --repo "$REPO" --color B60205 \
            --description "Nightly workflow failure" 2>/dev/null || true
          body="$(mktemp)"
          printf 'Nightly run failed on %s.\n\nRun: %s\n\nVisible score: %s\nBoxed ledger: %s\nEmbed acceptance: %s\nR0 lane: %s\n' \
            "$(date -u +%Y-%m-%d)" "$RUN_URL" \
            "${{ needs.visible-score.outputs.failed == 'true' && 'failed' || 'ok' }}" \
            "${{ needs.boxed-ledger.outputs.failed == 'true' && 'failed' || 'ok' }}" \
            "${{ needs.embed-acceptance.outputs.failed == 'true' && 'failed' || 'ok' }}" \
            "${{ needs.r0-lane.outputs.failed == 'true' && 'failed' || 'ok' }}" > "$body"
          existing="$(gh issue list --repo "$REPO" --label nightly-failure --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file "$body"
          else
            gh issue create --repo "$REPO" --label nightly-failure \
              --title "nightly failed: $(date -u +%Y-%m-%d)" --body-file "$body"
          fi

  # TODO(bolo): repository_dispatch to the bolo repo after V3's bolo PR merges
  # (plan 2026-10-21-v5, W3). Not wired. Needs a token decision first: a
  # fine-grained PAT or GitHub App with contents:write on bolo, stored as a
  # secret. The GITHUB_TOKEN cannot dispatch to another repository.
  # Also still missing from the T2 list: matrix builds and the self-compile
  # S1 re-baseline (W5).
  bolo-dispatch:
    name: TODO bolo repository_dispatch (not wired)
    # Gated off by an unset repo variable until the token decision lands.
    if: ${{ vars.BOLO_DISPATCH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "TODO bolo dispatch, once the token decision is made"
