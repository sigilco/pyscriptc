# Site: build, validate and deploy the assembled pyscriptc.pages.dev site.
#
# One Astro app (apps/web): landing at /, compat page at /compat; docs
# (docmd, docs/) at /docs. apps/web/scripts/assemble.mts assembles all three
# into apps/web/deploy/, which is the tree wrangler publishes. Web output is
# pnpm-only: no python, no uv.
#
# The paths filter keeps this workflow scoped to web/doc/data work, so a
# compiler PR never runs it and this never runs the ci.yml matrix.
#
# Pushes to master deploy with wrangler. The Pages project must be in
# direct-upload mode with CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets set; the owner does that in the Cloudflare dashboard.
#
# The nightly workflow calls this workflow's `site` job through
# workflow_call after a compat snapshot PR opens, so the PR check runs
# before the owner looks at it. Design: .agents/docs/compat-site.md.
# workflow_call never deploys: the `site` job only deploys on a push to
# master.

name: site

on:
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "docs/**"
      - "data/**"
      - "docs/.docmd/pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  pull_request:
    # bot/compat-snapshot carries only data/compat/*.json and changes data/,
    # so this workflow would otherwise fire on the nightly bot PR and its
    # pull_request run would sit at action_required (see ci.yml). The
    # nightly calls the `site` job below through workflow_call to validate
    # the data the bot PR carries, so nothing is lost here.
    branches-ignore:
      - bot/compat-snapshot
    paths:
      - "apps/web/**"
      - "docs/**"
      - "data/**"
      - "docs/.docmd/pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  workflow_dispatch:
  workflow_call:
    # Optional ref to check out, so the nightly can build the site over the
    # compat data the snapshot PR will carry (its own tree) instead of the
    # caller's commit. Empty (or a bare SHA) keeps the default checkout.
    inputs:
      ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: build, validate, deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/.docmd/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: ">=24.0.0"
          cache: pnpm
          cache-dependency-path: |
            docs/.docmd/pnpm-lock.yaml
            apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --dir docs/.docmd install --frozen-lockfile
          pnpm --dir apps/web install --frozen-lockfile

      - name: Build the site (landing + compat + docs, assemble)
        run: pnpm --dir apps/web run site:build

      - name: Validate the assembled tree
        run: pnpm --dir apps/web run validate

      - name: Typecheck the web app
        run: pnpm --dir apps/web run typecheck

      - name: Test the web seams
        run: pnpm --dir apps/web test

      - name: Assemble summary
        if: always()
        run: |
          pages="$(find apps/web/deploy -name '*.html' | wc -l | tr -d ' ')"
          files="$(find apps/web/deploy -type f | wc -l | tr -d ' ')"
          {
            echo "### Site assembly"
            echo ""
            echo "| part | location |"
            echo "| --- | --- |"
            echo "| landing | / |"
            echo "| docs | /docs |"
            echo "| compat | /compat |"
            echo ""
            echo "pages: $pages, files: $files"
          } >> "$GITHUB_STEP_SUMMARY"

      # npm, not pnpm: the pnpm global bin dir is not on PATH in the runner
      # shell, and the npm one is.
      - name: Install wrangler
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: npm install -g wrangler@4

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy ./apps/web/deploy --project-name=pyscriptc --commit-dirty=true
