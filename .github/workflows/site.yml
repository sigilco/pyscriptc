# Site: build and validate the assembled pyscriptc.pages.dev site.
#
# One Astro app (apps/web): landing at /, compat page at /compat; docs
# (docmd, docs/) at /docs. apps/web/scripts/assemble.mts assembles all three
# into apps/web/deploy/, which is the tree the dashboard build publishes. Web output is
# pnpm-only: no python, no uv.
#
# The paths filter keeps this workflow scoped to web/doc/data work, so a
# compiler PR never runs it and this never runs the ci.yml matrix.
#
# Deploys are not done here: the Cloudflare Pages project is git-connected
# in the dashboard and publishes every master push itself (the
# `Cloudflare Pages` check). This workflow is the validation gate only, so
# no Cloudflare secret lives in GitHub.
#
# The nightly workflow calls this workflow's `site` job through
# workflow_call after a compat snapshot PR opens, so the PR check runs
# before the owner looks at it. Design: .agents/docs/compat-site.md.

name: site

on:
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "docs/**"
      - "data/**"
      - "docs/.docmd/pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  pull_request:
    # bot/compat-snapshot carries only data/compat/*.json and changes data/,
    # so this workflow would otherwise fire on the nightly bot PR and its
    # pull_request run would sit at action_required (see ci.yml). The
    # nightly calls the `site` job below through workflow_call to validate
    # the data the bot PR carries, so nothing is lost here.
    branches-ignore:
      - bot/compat-snapshot
    paths:
      - "apps/web/**"
      - "docs/**"
      - "data/**"
      - "docs/.docmd/pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  workflow_dispatch:
  workflow_call:
    # Optional ref to check out, so the nightly can build the site over the
    # compat data the snapshot PR will carry (its own tree) instead of the
    # caller's commit. Empty (or a bare SHA) keeps the default checkout.
    inputs:
      ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: build, validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/.docmd/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: ">=24.0.0"
          cache: pnpm
          cache-dependency-path: |
            docs/.docmd/pnpm-lock.yaml
            apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --dir docs/.docmd install --frozen-lockfile
          pnpm --dir apps/web install --frozen-lockfile

      - name: Build the site (landing + compat + docs, assemble)
        env:
          # PostHog project API key for the site analytics. Without it the
          # build emits no analytics code at all (the site works unchanged).
          # Set it as a repository variable named PUBLIC_POSTHOG_TOKEN.
          PUBLIC_POSTHOG_TOKEN: ${{ vars.PUBLIC_POSTHOG_TOKEN }}
          # The deployment origin, sent as the `site` super property. Not
          # hardcoded anywhere, so a domain move is one variable change.
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: pnpm --dir apps/web run site:build

      - name: Validate the assembled tree
        run: pnpm --dir apps/web run validate

      - name: Typecheck the web app
        run: pnpm --dir apps/web run typecheck

      - name: Test the web seams
        run: pnpm --dir apps/web test

      - name: Assemble summary
        if: always()
        run: |
          pages="$(find apps/web/deploy -name '*.html' | wc -l | tr -d ' ')"
          files="$(find apps/web/deploy -type f | wc -l | tr -d ' ')"
          {
            echo "### Site assembly"
            echo ""
            echo "| part | location |"
            echo "| --- | --- |"
            echo "| landing | / |"
            echo "| docs | /docs |"
            echo "| compat | /compat |"
            echo ""
            echo "pages: $pages, files: $files"
          } >> "$GITHUB_STEP_SUMMARY"
