# Cut a release in two stages, because master is PR-only (ruleset `master: PR only`).
#
#   stage=prepare (default): run the release bar, then open a PR from release/vX.Y.Z that bumps
#                    pyproject.toml, uv.lock and CHANGELOG.md. Merge it like any PR.
#   stage=tag:       after the release PR is merged, verify the merged release commit and push the
#                    annotated tag vX.Y.Z. Tags are not covered by the ruleset.
#
# This workflow NEVER publishes. Pushing the tag triggers release.yml, which builds the binaries,
# drafts the GitHub Release and runs the PyPI verify job. The PyPI publish job refuses to run
# without a successful rehearsal of the release commit and then waits for the pypi-publish
# environment approval.
#
# Tokens. RELEASE_TOKEN (fine-grained PAT or GitHub App token, contents, pull-requests write) is
# preferred: PRs and tags it creates start other workflows. Without it the prepare stage falls
# back to GITHUB_TOKEN, which needs the repo setting "Allow GitHub Actions to create and approve
# pull requests" and whose PR does not start CI (close and reopen it, or push an empty commit
# from a person, to start the required checks). The tag stage needs RELEASE_TOKEN, because a tag
# pushed with GITHUB_TOKEN does not start release.yml; without it, push the tag by hand.
#
# The bar (see .github/scripts/release_bar.py and .agents/docs/release/release-process.md) runs in dry runs too.
# Overriding a failing check needs bypass_reason; it is echoed in the job summary, the PR body
# and the tag message.

name: cut-release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "prepare: bar check and release PR. tag: tag the merged release commit"
        type: choice
        options: [prepare, tag]
        default: prepare
      bump:
        description: "Which part of the version to bump (prerelease cuts an X.Y.ZrcN)"
        type: choice
        options: [patch, minor, major, prerelease]
        default: patch
        required: true
      rc_of:
        description: "prerelease only: which release the first rc is for (ignored when already on an rc)"
        type: choice
        options: [patch, minor, major]
        default: patch
      hotfix:
        description: "Hotfix patch: skips the content and gap checks only (install or first-run break)"
        type: boolean
        default: false
      bypass_reason:
        description: "Required to override any failing check. Echoed in the summary, PR and tag message"
        type: string
        default: ""
      dry_run:
        description: "Report only: print the version, changelog entry and bar; no PR, no tag"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cut-release
  cancel-in-progress: false

# Bar thresholds. Starting values; tune here after the next two releases.
env:
  PATCH_MIN_COMMITS: "10"
  PATCH_MIN_HOURS: "12"
  PATCH_MIN_PRS: "3"
  PATCH_MIN_USER_CHANGES: "1"
  MINOR_MIN_FEATURES: "2"
  MINOR_MIN_DAYS: "5"
  MAX_RC: "2"

jobs:
  cut:
    name: bar, release PR, tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      HAVE_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
      STAGE: ${{ inputs.stage }}
      BYPASS_REASON: ${{ inputs.bypass_reason }}
    steps:
      - name: Require master
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "cut-release must run from master, not $GITHUB_REF" >&2
            exit 1
          fi

      - name: Require RELEASE_TOKEN for the tag stage
        if: ${{ inputs.stage == 'tag' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$HAVE_RELEASE_TOKEN" != "true" ]; then
            echo "RELEASE_TOKEN secret is not set. A tag pushed with GITHUB_TOKEN will not start release.yml." >&2
            echo "Push the tag by hand instead: git tag -a vX.Y.Z <merged release commit> && git push origin vX.Y.Z" >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # ------------------------------------------------------------------ prepare

      - uses: astral-sh/setup-uv@v6
        if: ${{ inputs.stage == 'prepare' }}
        with:
          version: ">=0.13.4"  # emSign CA incident: uv 0.13.4 dropped the compromised root
          enable-cache: true
          python-version: "3.14"

      - name: Compute version, changelog entry and release bar
        if: ${{ inputs.stage == 'prepare' }}
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
          RC_OF: ${{ inputs.rc_of }}
          HOTFIX: ${{ inputs.hotfix }}
        run: |
          set -euo pipefail
          args=(plan --bump "$BUMP" --rc-of "$RC_OF" --repo "$GITHUB_REPOSITORY" --out-dir /tmp/cut-release --bypass-reason "$BYPASS_REASON")
          if [ "$HOTFIX" = "true" ]; then args+=(--hotfix); fi
          python3 .github/scripts/release_bar.py "${args[@]}"

      - name: Refuse if the tag already exists
        if: ${{ inputs.stage == 'prepare' }}
        env:
          TAG: v${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists on origin" >&2
            exit 1
          fi

      - name: Dry run summary
        if: ${{ inputs.stage == 'prepare' && inputs.dry_run }}
        run: |
          {
            echo "### Dry run: v${{ steps.plan.outputs.version }} (${{ steps.plan.outputs.class }})"
            echo
            echo "No branch, PR or tag was created. Re-run with dry_run unchecked to open the release PR."
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs in dry runs too, so a dry run is red when the real run would be refused.
      - name: Enforce the release bar
        if: ${{ inputs.stage == 'prepare' }}
        env:
          BAR_PASSED: ${{ steps.plan.outputs.bar_passed }}
          RELEASABLE: ${{ steps.plan.outputs.releasable }}
        run: |
          set -euo pipefail
          if [ "$RELEASABLE" != "true" ]; then
            echo "nothing releasable since the last tag (only chore, test and style commits); a bypass cannot fix that" >&2
            exit 1
          fi
          if [ "$BAR_PASSED" = "true" ]; then exit 0; fi
          if [ -n "${BYPASS_REASON//[[:space:]]/}" ]; then
            echo "Bar failed, bypassed: $BYPASS_REASON"
            echo "BYPASSED the release bar: $BYPASS_REASON" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "release bar failed; fix the failing checks or re-run with bypass_reason (see the job summary)" >&2
          exit 1

      - name: Open the release PR
        if: ${{ inputs.stage == 'prepare' && !inputs.dry_run }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CLASS: ${{ steps.plan.outputs.class }}
          BAR_PASSED: ${{ steps.plan.outputs.bar_passed }}
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "branch $branch already exists on origin; close its PR and delete it first" >&2
            exit 1
          fi
          git switch -c "$branch"
          cp /tmp/cut-release/pyproject.toml pyproject.toml
          python3 - <<'PY'
          from pathlib import Path

          entry = Path("/tmp/cut-release/entry.md").read_text()
          path = Path("CHANGELOG.md")
          text = path.read_text()
          marker = "\n## ["
          idx = text.find(marker)
          if idx == -1:
              text = text.rstrip() + "\n\n" + entry
          else:
              text = text[: idx + 1] + entry + "\n" + text[idx + 1 :]
          path.write_text(text)
          PY
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md uv.lock
          msg="chore(release): v$VERSION"
          if [ "$BAR_PASSED" != "true" ]; then msg="$msg"$'\n\n'"Bar bypassed: $BYPASS_REASON"; fi
          git commit -m "$msg"
          git push origin "$branch"

          {
            echo "Release v$VERSION ($CLASS), prepared by cut-release. Rehearsed base commit: \`$BASE_SHA\`."
            echo
            echo "Merge with squash or rebase while master is still at the base commit. If master moved, dispatch a rehearsal of the new tip (\`gh workflow run release.yml -f ref=<full SHA>\`) before tagging, or the publish gate will refuse."
            echo
            if [ "$BAR_PASSED" != "true" ]; then echo "Bar bypassed: $BYPASS_REASON"; echo; fi
            echo "After merge, run cut-release with stage=tag."
          } > /tmp/pr-body.md
          args=(--base master --head "$branch" --title "chore(release): v$VERSION" --body-file /tmp/pr-body.md)
          ms="$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" --jq ".[] | select(.title == \"v$VERSION\" or (.title | startswith(\"v$VERSION \"))) | .title" | head -1)"
          if [ -n "$ms" ]; then args+=(--milestone "$ms"); fi
          url="$(gh pr create "${args[@]}")"
          {
            echo "Release PR for v$VERSION: $url"
            if [ "$HAVE_RELEASE_TOKEN" != "true" ]; then
              echo
              echo "No RELEASE_TOKEN: this PR was opened with GITHUB_TOKEN, so the required checks did not start. Close and reopen it to start them, or merge it with the admin bypass."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------ tag

      - name: Verify the merged release commit
        if: ${{ inputs.stage == 'tag' }}
        id: merged
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s HEAD)"
          if ! [[ "$subject" =~ ^chore\(release\):\ v([0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?)(\ \(\#[0-9]+\))?$ ]]; then
            echo "master HEAD is not a release commit (subject: $subject). Merge the release PR first; tag only the release commit." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          pyver="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "$pyver" = "$version" ] || { echo "pyproject version $pyver does not match $version" >&2; exit 1; }
          extra="$(git diff --name-only HEAD~1 HEAD | grep -vxE 'pyproject.toml|uv.lock|CHANGELOG.md' || true)"
          if [ -n "$extra" ]; then
            echo "release commit touches more than pyproject.toml, uv.lock and CHANGELOG.md:" >&2
            echo "$extra" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "tag v$version already exists on origin" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require a rehearsal of the release commit
        if: ${{ inputs.stage == 'tag' }}
        run: python3 .github/scripts/release_bar.py check-rehearsal --sha "$(git rev-parse HEAD)" --repo "$GITHUB_REPOSITORY"

      - name: Tag dry run summary
        if: ${{ inputs.stage == 'tag' && inputs.dry_run }}
        run: |
          echo "Dry run: would tag v${{ steps.merged.outputs.version }} at $(git rev-parse HEAD). No tag was pushed." >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and push
        if: ${{ inputs.stage == 'tag' && !inputs.dry_run }}
        env:
          VERSION: ${{ steps.merged.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="v$VERSION"
          if [ -n "${BYPASS_REASON//[[:space:]]/}" ]; then msg="$msg"$'\n\n'"Bar bypassed: $BYPASS_REASON"; fi
          git tag -a "v$VERSION" -m "$msg"
          git push origin "refs/tags/v$VERSION"
          {
            echo "Tag v$VERSION pushed. release.yml builds the binaries and drafts the release. Publish waits for pypi-publish approval."
            if [ -n "${BYPASS_REASON//[[:space:]]/}" ]; then echo; echo "Bar bypassed: $BYPASS_REASON"; fi
          } >> "$GITHUB_STEP_SUMMARY"
