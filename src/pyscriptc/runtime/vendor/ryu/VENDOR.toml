# pin records where they came from and the hashes to re-verify against:
#
#   curl -sSL -o ryu-v2.0.tar.gz https://github.com/ulfjack/ryu/archive/refs/tags/v2.0.tar.gz
#   sha256sum ryu-v2.0.tar.gz
#
# Only the double-to-string drop-in is vendored (d2s.c plus its headers); the
# float (f2s), generic-128, fixed and parse halves of upstream are not used by
# the runtime. `d2s.c` keeps the `ryu/` include prefix, so it compiles with
# `-I runtime/vendor` and no source edits.
