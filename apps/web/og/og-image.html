<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pyscriptc social card</title>
    <!--
      The pyscriptc Open Graph card. 1200x630, rendered to
      apps/web/public/og-image.png.

      Regenerate:

        node og/render.mjs

      The script serves this file, screenshots the element at 1200x630 with
      the system browser through playwright-cli, and writes the PNG. Nothing
      here is random: same template, same bytes. The script also fails if the
      card overflows 630px, so a copy edit cannot silently clip the headline.

      Layout, sized for the smallest preview a messaging app renders: the
      logo mark and the wordmark up top, one short tagline set large, one
      footer line. Nothing on the card is under 28px, there is no terminal
      block and no small mono text, because none of that survives a 300px
      preview. Key content stays inside the centre 1000x500 safe area
      (100px side margins, 68px top and bottom).

      Every color is a token from src/styles/theme.css, so the card follows
      the site palette. The accent is the logo snake's deep blue and it is the
      only chromatic color on the card.
    -->
    <style>
      :root {
        --bg: #07080a;
        --ink: #f2f4f7;
        --ink-muted: #7c8798;
        --accent: #4d80c4;
        --hairline: rgba(255, 255, 255, 0.09);
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        background: var(--bg);
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 68px 100px;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        overflow: hidden;
      }

      .masthead {
        display: flex;
        align-items: center;
        gap: 34px;
        height: 160px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 34px;
      }

      /* The mark keeps its 512x284 aspect; the snake reads at any size
         because it is one continuous high-contrast stroke. */
      .brand img {
        width: 288px;
        height: 160px;
        object-fit: contain;
      }

      .wordmark {
        font-size: 76px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1;
        color: var(--ink);
      }

      .pitch {
        margin-top: auto;
        font-size: 72px;
        line-height: 1.1;
        letter-spacing: -0.03em;
        font-weight: 500;
        color: var(--ink);
        max-width: 1000px;
      }

      .pitch em {
        font-style: normal;
        color: var(--accent);
      }

      .footer {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 32px;
        margin-top: 40px;
        padding-top: 28px;
        border-top: 1px solid var(--hairline);
        font-size: 30px;
        letter-spacing: 0.01em;
      }

      .note {
        color: var(--ink-muted);
      }

      .url {
        font-weight: 700;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="card" id="og-card">
      <div class="masthead">
        <div class="brand">
          <img src="/public/logo-512.png" alt="pyscriptc" />
          <div class="wordmark">pyscriptc</div>
        </div>
      </div>

      <h1 class="pitch">Compile annotated Python to a <em>native binary</em>.</h1>

      <div class="footer">
        <span class="note">Python to native</span>
        <span class="url">pyscriptc.pages.dev</span>
      </div>
    </div>
  </body>
</html>
